<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Клубок">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Мой клубок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone column; sticky title; fixed 4-tab bar; full-screen sheets stack (view → edit) */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --ink:#111111; --mut:#8A877F; --line:#E2E0D8; --soft:#ECEAE3;
  --red:#FF5A36; --yel:#FFC93C; --blue:#1F4FD8; --grn:#2E9E5B; --slate:#5B6B8C; --pink:#E7A1B0;
  --on-red:#FFFFFF; --warn:#E5482A; --ok:#22894E;
  --f-d:"Unbounded","Arial Black",system-ui,sans-serif; --f-b:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141414; --surface:#1D1D1D; --ink:#F2F1EC; --mut:#9A978F; --line:#333331; --soft:#262624;
  --blue:#4A74F0; --slate:#7D8DB0; --warn:#FF7A5C; --ok:#4CC27E; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414; --surface:#1D1D1D; --ink:#F2F1EC; --mut:#9A978F; --line:#333331; --soft:#262624; --blue:#4A74F0; --slate:#7D8DB0; --warn:#FF7A5C; --ok:#4CC27E; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-b);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:18px 10px;display:flex;align-items:center;gap:10px}
h1{font:800 26px/1.05 var(--f-d);margin:0;letter-spacing:-.02em;flex:1}
.cnt{font:600 12px var(--f-b);background:var(--ink);color:var(--bg);padding:4px 9px;white-space:nowrap}
.menu-btn{border:2px solid var(--ink);background:var(--surface);width:38px;height:38px;display:grid;place-items:center;font-weight:800;font-size:18px;line-height:1}
.h3{font:700 11px var(--f-b);letter-spacing:.09em;text-transform:uppercase;display:flex;align-items:center;gap:7px;margin:18px 0 8px}
.h3 i{width:11px;height:11px;display:block}
.muted{color:var(--mut)}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--bg);padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.line{background:var(--surface);color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.sm{padding:6px 11px;min-height:36px;font-size:14px}
.btn.wide{width:100%}
.btn.danger{background:transparent;border-color:var(--warn);color:var(--warn)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:2px solid var(--ink);background:var(--surface);padding:5px 10px 5px 6px;display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.chip svg{width:22px;height:22px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip.txt{padding:5px 11px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:8px 2px 10px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--mut)}
nav.tabs button svg{width:28px;height:28px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:24;width:60px;height:60px;border:0;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:4px 4px 0 var(--ink)}
@media(min-width:592px){.fab{right:calc(50% - 264px)}}
/* shelf */
.shelf{margin-bottom:6px}
.shelf .srow{display:grid;grid-template-columns:repeat(4,1fr);align-items:end;padding:0 4px;gap:4px}
.board{height:10px;background:var(--ink);position:relative;margin-bottom:22px}
.board::before,.board::after{content:"";position:absolute;top:10px;width:8px;height:12px;background:var(--ink)}
.board::before{left:14px}.board::after{right:14px}
.yb{border:0;background:none;padding:0 0 12px;display:grid;justify-items:center;position:relative;min-width:0}
.yb svg{width:72px;height:72px;overflow:visible;display:block}
.yb.out{opacity:.38}
.yb .q{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font:700 11px var(--f-b);background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);padding:0 6px;border-radius:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.yb .tag{position:absolute;top:0;right:6px;width:24px;height:24px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.yb .tag svg{width:16px;height:16px}
.yb .nm{position:absolute;top:100%;left:0;right:0;margin-top:1px;font-size:10.5px;color:var(--mut);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{background:var(--surface);border:2px solid var(--ink);padding:24px 18px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font:800 18px var(--f-d);margin:0}
.empty p{margin:0;max-width:32ch;color:var(--mut)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tl{border:0;padding:0;aspect-ratio:4/5;display:grid;place-items:center;position:relative;overflow:hidden;color:#fff;max-width:100%}
.tl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tl svg{width:44px;height:44px}
.tl em{position:absolute;left:0;right:0;bottom:0;font:600 11px var(--f-b);font-style:normal;padding:14px 6px 5px;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* scene */
.scene{border:2px solid var(--ink);margin-bottom:8px;overflow:hidden}
.scene svg{width:100%;height:auto;display:block}
.sc{cursor:pointer}
.sc:focus{outline:none}
.sc.on path,.sc.on rect,.sc.on circle,.sc.on ellipse{stroke:var(--red)!important;stroke-width:4!important;stroke-dasharray:none!important}
/* baskets */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bk{background:var(--surface);border:2px solid var(--ink);display:flex;flex-direction:column;position:relative;padding:0;text-align:left;min-width:0}
.bk .ref{height:104px;position:relative;overflow:hidden;display:grid;place-items:center}
.bk .ref img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bk .ref svg{width:48px;height:48px}
.basket{height:54px;position:relative;margin-top:-20px}
.basket .bb{position:absolute;bottom:0;left:10px;right:10px;height:32px;background:var(--yel);clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);border-top:3px solid var(--ink)}
.basket .bb::after{content:"";position:absolute;inset:6px 0 0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.18) 9px 11px)}
.basket .mini{position:absolute;bottom:18px;width:34px;height:34px}
.basket .mini svg{width:34px;height:34px;overflow:visible}
.bk .t{padding:8px 10px 10px;display:grid;gap:2px;min-width:0}
.bk .t b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ok{font-size:12px;font-weight:600;color:var(--ok)}.need{font-size:12px;font-weight:600;color:var(--warn)}.nil{font-size:12px;color:var(--mut)}
.bow{position:absolute;top:7px;right:7px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;z-index:2}
.bk.new{border-style:dashed;border-color:var(--mut);background:transparent;justify-content:center;align-items:center;gap:4px;color:var(--mut);font-size:13px;min-height:190px;text-align:center}
.bk.new b{font:800 32px var(--f-d);color:var(--ink)}
.strip{margin-top:14px;background:var(--ink);color:var(--bg);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;width:100%;text-align:left;font-weight:600}
.strip b{background:var(--red);color:#fff;padding:3px 9px;font-size:13px;white-space:nowrap}
/* wip cards */
.wc{background:var(--surface);border:2px solid var(--ink);display:grid;grid-template-columns:96px 1fr auto;align-items:stretch;min-height:104px;margin-bottom:10px}
.wc .im{position:relative;overflow:hidden;display:grid;place-items:center;border:0;padding:0}
.wc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wc .im svg{width:40px;height:40px}
.wc .mid{border:0;background:none;text-align:left;padding:10px 12px;display:grid;gap:5px;align-content:center;min-width:0}
.wc .mid b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--soft);position:relative}.bar i{position:absolute;inset:0 auto 0 0;background:var(--red)}
.meta{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap}
.tbtn{border:0;border-left:2px solid var(--ink);background:var(--yel);color:#111;width:74px;display:grid;place-items:center;align-content:center;gap:2px;font-weight:800;font-size:12px}
.tbtn svg{width:26px;height:26px}
.tbtn.on{background:var(--red);color:#fff}
.tick{font-variant-numeric:tabular-nums}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh-head{position:sticky;top:0;z-index:3;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.sh-head .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sh-head h2{flex:1;min-width:0;font:800 17px var(--f-d);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq-btn{border:2px solid var(--ink);background:var(--surface);width:40px;height:40px;display:grid;place-items:center;flex:none;padding:0}
.save-st{font-size:12px;color:var(--mut);white-space:nowrap}
.sh-body{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sh-body.flush{padding-top:0}
/* view */
.gal{position:relative;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:min(78vw,380px);background:var(--soft)}
.gal::-webkit-scrollbar{display:none}
.gal .sl{flex:0 0 100%;scroll-snap-align:center;position:relative;border:0;padding:0;background:none;display:grid;place-items:center}
.gal .sl img{width:100%;height:100%;object-fit:cover}
.gal .sl svg{width:120px;height:120px}
.gal-wrap{position:relative}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;gap:6px;justify-content:center;pointer-events:none}
.dots b{width:7px;height:7px;background:rgba(255,255,255,.6);box-shadow:0 0 0 1px rgba(0,0,0,.25)}.dots b.on{background:#fff;width:18px}
.gal-lab{position:absolute;top:12px;left:12px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;padding:3px 8px;pointer-events:none}
.ttl{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.ttl h3{font:800 22px/1.15 var(--f-d);margin:0;letter-spacing:-.02em;text-wrap:balance}
.pill{font:700 11.5px var(--f-b);padding:4px 9px;white-space:nowrap;flex:none}
.p-plan{background:var(--blue);color:#fff}.p-wip{background:var(--yel);color:#111}.p-frozen{background:var(--soft);color:var(--mut)}.p-done{background:var(--grn);color:#fff}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{border:2px solid var(--ink);background:var(--surface);padding:10px;display:grid;gap:3px;align-content:start;text-align:left;min-width:0}
.k small{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.k.hook{background:var(--red);border-color:var(--red);color:#fff}
.k.hook b{font:800 30px/1 var(--f-d)}
.k.hook span{font-size:12px;opacity:.9}
.k.sch .im{height:96px;background:var(--soft);display:grid;place-items:center;overflow:hidden;position:relative}
.k.sch .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.k.sch a,.k.sch .lnk{font-size:12px;color:var(--blue);font-weight:600;text-decoration:none}
.k.wide{grid-column:1/-1}
.yrow{display:flex;gap:12px;flex-wrap:wrap}
.yrow button{border:0;background:none;padding:0 0 10px;position:relative;display:grid;justify-items:center}
.yrow svg{width:56px;height:56px;overflow:visible}
.yrow em{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font:700 10.5px var(--f-b);font-style:normal;background:var(--ink);color:var(--bg);padding:0 6px;border-radius:9px;white-space:nowrap}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.facts span svg{width:18px;height:18px;display:block}
.facts span{font-size:13px;background:var(--surface);border:1.5px solid var(--line);padding:5px 9px;font-variant-numeric:tabular-nums}
.facts a{font-size:13px;border:1.5px solid var(--blue);color:var(--blue);padding:5px 9px;text-decoration:none;font-weight:600}
.blk{background:var(--surface);border:2px solid var(--ink);padding:12px;display:grid;gap:10px}
.blk-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.blk-h b{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(22px,1fr));gap:3px}
.sqs button{aspect-ratio:1;border:0;padding:0;background:var(--soft)}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.parts button{border:2px solid var(--ink);background:var(--surface);padding:7px 10px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.parts button.on{background:var(--ink);color:var(--bg)}
.counter{display:flex;align-items:center;gap:12px}
.counter b{font:800 34px var(--f-d);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.counter button{width:48px;height:48px;border:2px solid var(--ink);background:var(--surface);font:800 22px var(--f-d)}
.counter button.plus{background:var(--red);border-color:var(--red);color:#fff}
.actions{display:grid;gap:8px}
.big-timer{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--yel);color:#111;border:2px solid var(--ink);padding:10px 12px;font-weight:700}
.big-timer.on{background:var(--red);color:#fff}
.big-timer .tick{font:800 22px var(--f-d)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;flex:none;border:2px solid var(--ink);background:var(--surface);font:800 20px var(--f-d);padding:0}
.stepper b{font:800 24px var(--f-d);min-width:1.6ch;text-align:center;font-variant-numeric:tabular-nums}
.kpy{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.kpy .k b{font:800 22px var(--f-d);font-variant-numeric:tabular-nums}
.cdots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cdots i{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);display:block}
.hero-ball{height:260px;display:grid;place-items:center;background:var(--soft);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.hero-ball svg{width:170px;height:170px;overflow:visible}
.hero-photo{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));height:min(80vw,360px);background:var(--soft);position:relative;border:0;padding:0;display:block;width:calc(100% + 2 * max(16px,env(safe-area-inset-left,0px)))}
.hero-photo img{width:100%;height:100%;object-fit:cover;display:block}
.hero-photo .ball-badge{position:absolute;right:14px;top:14px;width:64px;height:64px}
.hero-photo .ball-badge svg{width:64px;height:64px;overflow:visible}
.ptiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ptiles .tl{aspect-ratio:1}
.ptiles .tl svg{width:30px;height:30px}
/* edit form */
.sec{background:var(--surface);border:2px solid var(--ink);padding:14px;display:grid;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h4,.sec-h h4{font:800 14px var(--f-d);margin:0}
.grid2f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--mut)}
input[type=text],input[type=number],input[type=url],input[type=date],select,textarea{width:100%;min-width:0;border:2px solid var(--line);background:var(--bg);border-radius:0;padding:10px 11px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{min-height:72px;resize:vertical}
.check{display:flex;align-items:center;gap:10px}
.check input{width:22px;height:22px;accent-color:var(--red);flex:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--bg);padding:7px 11px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.catgrid button{border:2px solid transparent;padding:6px 2px 5px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:#fff;min-width:0}
.catgrid button svg{width:30px;height:30px}
.catgrid button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.catgrid button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--bg)}
.row{border:2px solid var(--line);padding:10px;display:grid;gap:8px}
.row-top{display:flex;gap:8px;align-items:center}
.row-top>*:first-child{flex:1;min-width:0}
.x{border:0;background:none;color:var(--mut);width:36px;height:36px;flex:none;font-size:22px;line-height:1}
.hint{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.hint.bad{color:var(--warn);font-weight:600}
.hm{display:flex;gap:6px;align-items:center}
.hm input{width:62px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.imgs .im{aspect-ratio:1;overflow:hidden;background:var(--soft);border:0;padding:0;max-width:100%}
.imgs .im img{width:100%;height:100%;object-fit:cover;display:block}
.add-img{aspect-ratio:1;border:2px dashed var(--mut);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mut);padding:6px;cursor:pointer}
.add-img b{font:800 24px var(--f-d);color:var(--ink);display:block}
details.more{background:var(--surface);border:2px solid var(--ink)}
details.more>summary{padding:14px;font:800 14px var(--f-d);cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.more>summary::after{content:"+";font-size:18px}
details.more[open]>summary::after{content:"−"}
details.more>.in{padding:0 14px 14px;display:grid;gap:12px}
.confirm{background:var(--surface);border:2px solid var(--warn);padding:12px;display:grid;gap:10px}

<script>
(() => {
// ================= helpers =================
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtN = n => (Math.round(n*100)/100).toLocaleString('ru-RU');
const money = n => n ? fmtN(Math.round(n*100)/100) + ' BYN' : '';
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2)));
const fmtMin = m => { m = Math.round(m||0); if (!m) return '0 мин'; const h = Math.floor(m/60), mm = m%60; return ((h? h+' ч ':'') + (mm? mm+' мин':'')).trim(); };
const fmtH = m => { m = Math.round(m||0); if (m < 60) return m + ' мин'; const h = m/60; return (h >= 10 ? Math.round(h) : Math.round(h*10)/10).toLocaleString('ru-RU') + ' ч'; };
const fmtClock = ms => { const s = Math.max(0, Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60; return (h? h+':':'') + String(m).padStart(h?2:1,'0') + ':' + String(ss).padStart(2,'0'); };
const fmtDate = d => d ? new Date(d+'T00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'}) : '';
const today = () => new Date().toISOString().slice(0,10);
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; };

// ================= dictionaries =================
const STATUS = {plan:'В планах', wip:'Вяжу', frozen:'На паузе', done:'Готово'};
const GROUPS = {wool:'Шерсть', cotton:'Хлопок', other:'Остальное'};
const GROUP_COL = {wool:'#B5552B', cotton:'#FFC93C', other:'#1F4FD8'};
function autoGroup(y){ const c = String(y?.composition||'').toLowerCase(); if (/шерст|мерин|альпак|мохер|кашемир|ангор|верблюж|wool|merino|alpaca|mohair|cashmere|angora/.test(c)) return 'wool'; if (/хлоп|(^|[^а-яё])л[её]н|льн|бамбук|вискоз|cotton|linen|bamboo|viscose/.test(c)) return 'cotton'; return 'other'; }
const yarnGroup = y => GROUPS[y?.group] ? y.group : autoGroup(y);
const STAGES = {knit:'Вязание', join:'Связывание', edge:'Обвязка', block:'ВТО', assembly:'Сборка', other:'Другое'};
const BLOCK = ['Влажное','Паром','Стирка','На закрепке'];
const HOOKS = ['1.5','1.75','2','2.5','3','3.5','4','4.5','5','5.5','6','6.5','7','8','9','10','12','15'];
const PROG = {regular:'Не считать', granny:'Квадраты', parts:'Детали', motif:'Штуки'};
const PARTS_PRESET = {card:['Спинка','Перед левый','Перед правый','Рукав','Рукав','Обвязка'], vest:['Спинка','Перед','Обвязка'], mit:['Левая','Правая'], mitts:['Левая','Правая'], sock:['Левый','Правый']};

// ================= icons (style A: filled shapes) =================
const SH = {
 snow:{d:'M24 5v38M7.5 14.5l33 19M7.5 33.5l33-19M18.5 7.5L24 13l5.5-5.5M18.5 40.5L24 35l5.5 5.5M7 21.5l7.3 1.8-2-7M41 26.5l-7.3-1.8 2 7M7 26.5l7.3-1.8-2 7M41 21.5l-7.3 1.8 2-7',line:1},
 hat:{d:'M9 33a15 15 0 0130 0z',e:'M7 33h34v7H7z',c:[24,12,4]},
 scarf:{d:'M11 8h26v10H11z',e:'M15 18v24l7-3V18zM28 18v17l6 3V18z'},
 mit:{d:'M16 43v-6c-3-2-4-5-4-9V17a8 8 0 0116 0v6l5-4a4 4 0 016 5l-8 11v8z'},
 mitts:{d:'M14 43V17l3-6h14l3 6v26z',e:'M14 23h20M14 29h20',open:1},
 sock:{d:'M16 5h14v20l8 9a6 6 0 01-9 8L16 30z',e:'M16 12h14',open:1},
 card:{d:'M17 6L8 12v30h12V18zM31 6l9 6v30H28V18z',e:'M17 6c2 6 5 8 7 8s5-2 7-8'},
 vest:{d:'M16 6c2 5 5 7 8 7s6-2 8-7l7 6-3 9v21H12V21l-3-9z'},
 bag:{d:'M9 18h30l-3 24H12z',e:'M17 18v-5a7 7 0 0114 0v5',open:1},
 shawl:{d:'M5 10h38L24 41z',e:'M15 10l9 16 9-16',open:1},
 plaid:{d:'M7 7h34v34H7z',e:'M7 18.5h34M7 29.5h34M18.5 7v34M29.5 7v34',open:1},
 cat:{d:'M10 41V24L8 9l9 7h14l9-7-2 15v17z',e:'M19 26h1M28 26h1',open:1},
 heart:{d:'M24 41L9 26a8.5 8.5 0 0112-12l3 3 3-3a8.5 8.5 0 0112 12z'},
 star:{d:'M24 5l5.5 12.5 13.5 1.2-10.3 9 3.1 13.3L24 34l-11.8 7 3.1-13.3-10.3-9 13.5-1.2z'},
 flower:{d:'M24 18a6 6 0 110-.01M24 30a6 6 0 110-.01M18 24a6 6 0 110-.01M30 24a6 6 0 110-.01',e:'M24 28a4 4 0 100-8 4 4 0 000 8z'},
 cup:{d:'M8 14h26v14a10 10 0 01-10 10h-6A10 10 0 018 28z',e:'M34 18h3a5 5 0 010 10h-3',open:1},
 tree:{d:'M24 4l11 16h-6l9 13H10l9-13h-6z',e:'M21 33h6v9h-6z'},
 ball:{d:'M24 7a17 17 0 110 34 17 17 0 010-34z',e:'M11 17c8 2 18 10 21 22M9 25c8 0 15 6 17 15M17 9c6 4 14 12 20 14',open:1},
 shelf:{d:'M5 17h38v4H5zM5 37h38v4H5z',e:'M13 11a5 5 0 100 .01M24 11a5 5 0 100 .01M35 31a5 5 0 100 .01M24 31a5 5 0 100 .01'},
 basket:{d:'M5 20h38l-5 22H10z',e:'M15 20l6-12M33 20l-6-12',open:1},
 now:{d:'M24 9a16 16 0 110 32 16 16 0 010-32z',e:'M24 16v9l6 4M19 4h10',open:1},
 house:{d:'M6 22L24 7l18 15v20H6z',e:'M19 42V30h10v12'}
};
function icon(k, fg, bg){
  const s = SH[k] || SH.star; bg = bg || 'transparent';
  if (s.line) return `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="${s.d}" style="fill:none;stroke:${fg};stroke-width:5;stroke-linecap:square"/></svg>`;
  const e = s.e ? `<path d="${s.e}" style="fill:${s.open?'none':bg};stroke:${s.open?bg:fg};stroke-width:${s.open?3.5:2};stroke-linecap:round;stroke-linejoin:round"/>` : '';
  const c = s.c ? `<circle cx="${s.c[0]}" cy="${s.c[1]}" r="${s.c[2]}" style="fill:${fg}"/>` : '';
  return `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="${s.d}" style="fill:${fg};stroke:${fg};stroke-width:2;stroke-linejoin:round"/>${e}${c}</svg>`;
}
const LIGHT = c => { const h = String(c||'').replace('#',''); if (h.length!==6) return false; const n=parseInt(h,16); const r=n>>16,g=n>>8&255,b=n&255; return (r*299+g*587+b*114)/1000 > 165; };
const DEFAULT_CATS = [
 {id:'snow',name:'Снежинки',icon:'snow',color:'#1F4FD8'},
 {id:'hat',name:'Шапки',icon:'hat',color:'#FF5A36'},
 {id:'scarf',name:'Шарфы',icon:'scarf',color:'#FFC93C'},
 {id:'mit',name:'Варежки',icon:'mit',color:'#2E9E5B'},
 {id:'mitts',name:'Митенки',icon:'mitts',color:'#E7A1B0'},
 {id:'sock',name:'Носки',icon:'sock',color:'#5B6B8C'},
 {id:'card',name:'Кардиганы',icon:'card',color:'#111111'},
 {id:'vest',name:'Жилетки',icon:'vest',color:'#FF5A36'},
 {id:'bag',name:'Сумки',icon:'bag',color:'#2E9E5B'},
 {id:'shawl',name:'Шали и платки',icon:'shawl',color:'#E7A1B0'},
 {id:'plaid',name:'Пледы',icon:'plaid',color:'#FFC93C'},
 {id:'cat',name:'Для котика',icon:'cat',color:'#5B6B8C'},
 {id:'other',name:'Другое',icon:'star',color:'#1F4FD8'}
];
const ICON_LIB = ['heart','star','flower','cup','tree','ball','snow','hat','scarf','mit','mitts','sock','card','vest','bag','shawl','plaid','cat'];
const PALETTE = ['#FF5A36','#FFC93C','#1F4FD8','#2E9E5B','#111111','#5B6B8C','#E7A1B0','#B5552B'];
function allCats(){ const custom = (MEM.meta.get('cats')?.list) || []; const base = DEFAULT_CATS.filter(c=>c.id!=='other'); return [...base, ...custom, DEFAULT_CATS.find(c=>c.id==='other')]; }
const catInfo = id => allCats().find(c=>c.id===id) || DEFAULT_CATS.find(c=>c.id==='other');
function catOf(p){
  if (p.category && allCats().some(c=>c.id===p.category)) return p.category;
  const k = String(p.kind||p.title||'').toLowerCase();
  const map = [[/снежин/,'snow'],[/шапк|бини|берет|панам/,'hat'],[/шарф|снуд/,'scarf'],[/варежк/,'mit'],[/митенк/,'mitts'],[/носк|следк/,'sock'],[/кардиган|свитер|кофт|джемпер/,'card'],[/жилет/,'vest'],[/сумк|шопер/,'bag'],[/шал|платок|бактус/,'shawl'],[/плед|покрывал/,'plaid'],[/кот|кош/,'cat']];
  for (const [re,id] of map) if (re.test(k)) return id;
  if (p.type==='motif') return 'snow';
  return 'other';
}
const catTile = (id, size) => { const c = catInfo(id); const fg = LIGHT(c.color) ? '#111' : '#fff'; return {bg:c.color, fg, svg:icon(c.icon, fg, c.color)}; };

// ================= yarn ball (procedural SVG) =================
const shade=(hex,f)=>{ const n=parseInt(String(hex||'#999999').slice(1),16); let r=n>>16,g=n>>8&255,b=n&255; const t=f<0?0:255,p=Math.abs(f); r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b); return `rgb(${r},${g},${b})`; };
let ballN = 0;
function yarnColors(y){ const c = (Array.isArray(y?.colors) && y.colors.length) ? y.colors : [y?.color || '#C9B8D6']; return (y?.multi===false) ? [c[0]] : (y?.multi ? c : [c[0]]); }
function ballSVG(kind, cols){
  const id = 'bc' + (ballN++); cols = (cols && cols.length) ? cols : ['#C9B8D6']; const c = cols[0]; const R = 34;
  let base = '';
  if (cols.length === 1) base = `<circle r="${R}" fill="${c}"/>`;
  else { const n = Math.max(6, cols.length*2); for (let i=0;i<n;i++){ const a0=i/n*2*Math.PI-1.2, a1=(i+1)/n*2*Math.PI-1.2, RR=R+2; base += `<path d="M0 0L${(RR*Math.cos(a0)).toFixed(1)} ${(RR*Math.sin(a0)).toFixed(1)}A${RR} ${RR} 0 0 1 ${(RR*Math.cos(a1)).toFixed(1)} ${(RR*Math.sin(a1)).toFixed(1)}z" fill="${cols[i%cols.length]}"/>`; } }
  let wraps = '';
  [[-30,9],[60,7],[150,7]].forEach(([rot,cnt],si)=>{ for (let j=0;j<cnt;j++){ const off=-R+(j+0.5)*(2*R/cnt); const col = cols.length>1 ? shade(cols[(j+si)%cols.length],-.28) : shade(c,-.3);
    wraps += `<path d="M${-R-4} ${off.toFixed(1)} Q 0 ${(off+(kind==='cotton'?10:14)).toFixed(1)} ${R+4} ${off.toFixed(1)}" transform="rotate(${rot})" fill="none" stroke="${col}" stroke-width="${kind==='cotton'?1.6:2.6}" ${kind==='wool'?'filter="url(#soft)"':''} opacity="${si===2?.55:.85}"/>`; } });
  let extra = '', halo = '';
  if (kind==='cotton') extra = `<path d="M-20 -22 Q -6 -30 10 -26" stroke="rgba(255,255,255,.75)" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle r="${R}" fill="none" stroke="${shade(c,-.45)}" stroke-width="1.5"/>`;
  if (kind==='other') extra = `<circle r="${R}" fill="url(#dots)"/><circle r="${R}" fill="none" stroke="${shade(c,-.45)}" stroke-width="1.5"/>`;
  if (kind==='wool'){ let h=''; for (let i=0;i<72;i++){ const a=i/72*2*Math.PI, r1=R-2, r2=R+4+((i*37)%5); const col = cols[i%cols.length]; h += `<line x1="${(r1*Math.cos(a)).toFixed(1)}" y1="${(r1*Math.sin(a)).toFixed(1)}" x2="${(r2*Math.cos(a+.06)).toFixed(1)}" y2="${(r2*Math.sin(a+.06)).toFixed(1)}" stroke="${shade(col,.25)}" stroke-width="1.1" stroke-linecap="round"/>`; } halo = `<g filter="url(#fuzz)" opacity=".9">${h}</g>`; }
  const tail = `<path d="M26 22 q10 4 6 12 q-3 6 6 8" fill="none" stroke="${shade(c, kind==='wool'?.1:-.2)}" stroke-width="${kind==='cotton'?1.8:2.4}" stroke-linecap="round" ${kind==='wool'?'filter="url(#fuzz)"':''}/>`;
  return `<svg viewBox="-42 -42 84 84" aria-hidden="true"><defs><clipPath id="${id}"><circle r="${R}"/></clipPath></defs>${halo}${tail}<g clip-path="url(#${id})">${base}${wraps}</g>${extra}</svg>`;
}
const yarnBall = y => ballSVG(yarnGroup(y), yarnColors(y));

// ================= color from photo =================
const hex = (r,g,b) => '#' + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);
async function extractColors(blob){
  try{
    const url = URL.createObjectURL(blob); const im = new Image(); im.src = url; await im.decode();
    const N = 64, cv = document.createElement('canvas'); cv.width = cv.height = N; const x = cv.getContext('2d', {willReadFrequently:true});
    const s = Math.min(im.naturalWidth, im.naturalHeight); x.drawImage(im, (im.naturalWidth-s)/2, (im.naturalHeight-s)/2, s, s, 0, 0, N, N); URL.revokeObjectURL(url);
    const d = x.getImageData(0,0,N,N).data; const px = (i,j) => { const o=(j*N+i)*4; return [d[o],d[o+1],d[o+2]]; };
    const border = []; for (let i=0;i<N;i++){ border.push(px(i,0),px(i,N-1),px(0,i),px(N-1,i)); }
    const bgc = border.reduce((a,p)=>[a[0]+p[0],a[1]+p[1],a[2]+p[2]],[0,0,0]).map(v=>v/border.length);
    let pts = []; const lo = Math.floor(N*.18), hi = Math.ceil(N*.82);
    for (let j=lo;j<hi;j++) for (let i=lo;i<hi;i++){ const p = px(i,j); if (dist(p,bgc) > 45) pts.push(p); }
    if (pts.length < 80){ pts = []; for (let j=lo;j<hi;j++) for (let i=lo;i<hi;i++) pts.push(px(i,j)); }
    const K = 4; let cent = [0,1,2,3].map(k => pts[Math.floor((k+.5)/K*pts.length)].slice());
    let lab = new Array(pts.length).fill(0);
    for (let it=0; it<10; it++){
      for (let n=0;n<pts.length;n++){ let b=0, bd=1e9; for (let k=0;k<K;k++){ const dd=dist(pts[n],cent[k]); if (dd<bd){bd=dd;b=k;} } lab[n]=b; }
      const sum = cent.map(()=>[0,0,0,0]); pts.forEach((p,n)=>{ const s=sum[lab[n]]; s[0]+=p[0]; s[1]+=p[1]; s[2]+=p[2]; s[3]++; });
      cent = sum.map((s,k)=> s[3] ? [s[0]/s[3], s[1]/s[3], s[2]/s[3]] : cent[k]);
    }
    const cnt = cent.map(()=>0); lab.forEach(l=>cnt[l]++);
    let cl = cent.map((c,k)=>({c, share:cnt[k]/pts.length})).sort((a,b)=>b.share-a.share);
    // merge close clusters (shadows of the same colour)
    const merged = [];
    for (const k of cl){ const m = merged.find(z => dist(z.c,k.c) < 70); if (m){ m.share += k.share; } else merged.push({...k}); }
    merged.sort((a,b)=>b.share-a.share);
    const main = merged[0]; const others = merged.slice(1).filter(z => z.share >= .14 && dist(z.c, main.c) > 85);
    const colors = [main, ...others].slice(0,4).map(z=>hex(...z.c));
    return {colors, multi: colors.length > 1};
  }catch(e){ return {colors:['#C9B8D6'], multi:false}; }
}

// ================= local storage (IndexedDB) =================
const URLS = {};
const img = id => URLS[id] || '';
const LS = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('klubok', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('docs', {keyPath:'key'}); d.createObjectStore('blobs', {keyPath:'id'}); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const st = t.objectStore(store); let out; const r = fn(st); if (r) r.onsuccess = () => out = r.result; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    allDocs: () => tx('docs','readonly', s => s.getAll()),
    putDoc: (coll, id, data) => tx('docs','readwrite', s => s.put({key:coll+'/'+id, coll, id, data})),
    delDoc: (coll, id) => tx('docs','readwrite', s => s.delete(coll+'/'+id)),
    allBlobs: () => tx('blobs','readonly', s => s.getAll()),
    putBlob: (id, blob) => tx('blobs','readwrite', s => s.put({id, blob})),
    delBlob: id => tx('blobs','readwrite', s => s.delete(id)),
    clearAll: async () => { await tx('docs','readwrite', s => s.clear()); await tx('blobs','readwrite', s => s.clear()); }
  };
})();
const COLLS = ['projects','yarns','people','shop','ideas','meta'];
const MEM = Object.fromEntries(COLLS.map(c=>[c,new Map()]));
const LISTEN = Object.fromEntries(COLLS.map(c=>[c,[]]));
const clone = o => JSON.parse(JSON.stringify(o));
function emit(c){ const docs = [...MEM[c]].map(([id, d]) => ({id, data:() => d})); queueMicrotask(() => LISTEN[c].forEach(fn => fn({docs}))); }
function docRef(c, id){
  return { id,
    async set(d){ const v = clone(d); await LS.putDoc(c, id, v); MEM[c].set(id, v); emit(c); },
    async update(d){ const cur = MEM[c].get(id); if (!cur) throw {code:'missing'}; const v = {...cur, ...clone(d)}; await LS.putDoc(c, id, v); MEM[c].set(id, v); emit(c); },
    async delete(){ await LS.delDoc(c, id); MEM[c].delete(id); emit(c); } };
}
const db = { collection: c => ({ doc: id => docRef(c, id || uid()), add: async d => { const r = docRef(c, uid()); await r.set(d); return r; }, onSnapshot: fn => { LISTEN[c].push(fn); emit(c); } }) };
const assets = {
  async upload(blob){ const id = uid().replace(/-/g,''); await LS.putBlob(id, blob); URLS[id] = URL.createObjectURL(blob); return {id, url:URLS[id]}; },
  async delete(id){ await LS.delBlob(id); if (URLS[id]) URL.revokeObjectURL(URLS[id]); delete URLS[id]; }
};
async function compress(file){
  try{
    const url = URL.createObjectURL(file); const im = new Image(); im.src = url; await im.decode();
    const max = 1600; let w = im.naturalWidth, h = im.naturalHeight; const k = Math.min(1, max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
    const c = document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h); URL.revokeObjectURL(url);
    return await new Promise(r=>c.toBlob(b=>r(b||file), 'image/jpeg', 0.84));
  }catch(e){ return file; }
}
async function uploadPhoto(file){ const blob = await compress(file); const r = await assets.upload(blob); return {id:r.id, blob}; }
// remove photos nothing points at any more
async function gcBlobs(ids){
  const used = new Set();
  for (const p of MEM.projects.values()) for (const k of ['photos','patternImgs','refImgs']) (p[k]||[]).forEach(x => used.add(x));
  for (const y of MEM.yarns.values()) if (y.photo) used.add(y.photo);
  for (const fr of STACK) if (fr.ed){ const F = fr.ed.form; for (const k of ['photos','patternImgs','refImgs']) (F[k]||[]).forEach(x => used.add(x)); if (F.photo) used.add(F.photo); }
  for (const id of ids) if (id && !used.has(id)) { try{ await assets.delete(id); }catch(e){} }
}

const S = {projects:[], yarns:[], people:[], shop:[], ideas:[], tab:'shelf', doneCat:'all', loaded:false, err:null, shopOpen:false};
const STACK = []; // sheet frames: {t:'view', kind, id} | {t:'edit', ed}
let ED = null;
const yarnById = id => S.yarns.find(y => y.id === id);
const projById = id => S.projects.find(p => p.id === id);
const personById = id => S.people.find(p => p.id === id);
function yarnUse(yid, excludeProjectId){
  let used=0, reserved=0; const where=[];
  for (const p of S.projects){ if (p.id === excludeProjectId) continue;
    for (const a of (p.yarns||[])) if (a.yarnId === yid && num(a.skeins)>0){ if (p.status==='done') used += num(a.skeins); else reserved += num(a.skeins); where.push({p, n:num(a.skeins)}); } }
  return {used, reserved, where};
}
function yarnBalance(y){ const u = yarnUse(y.id); const qty=num(y.qty); return {...u, qty, shelf: qty-u.used, free: qty-u.used-u.reserved}; }
const totalMin = p => (p.stages||[]).reduce((s,x)=>s+num(x.minutes),0) + (p.parts||[]).reduce((s,x)=>s+num(x.minutes),0);
function projCost(p){ let c=0; for (const a of (p.yarns||[])){ const y=yarnById(a.yarnId); if (y) c += num(a.skeins)*num(y.price); } return c + num(p.hardwareCost); }
const projSkeins = p => (p.yarns||[]).reduce((s,a)=>s+num(a.skeins),0);
const motifRate = p => { const sk=projSkeins(p); return (p.type==='motif' && sk>0 && num(p.motifCount)>0) ? num(p.motifCount)/sk : 0; };
const hooksOf = p => [...new Set((p.stages||[]).map(s=>String(s.hook||'').trim()).filter(Boolean))];
const cover = p => (p.photos||[])[0] || (p.refImgs||[])[0] || (p.patternImgs||[])[0];
function progressOf(p){
  if (p.type==='granny' && num(p.grannyCount)>0) return Math.min(1, num(p.grannyDone)/num(p.grannyCount));
  if (p.type==='parts' && (p.parts||[]).length) return p.parts.filter(x=>x.done).length / p.parts.length;
  if (p.type==='motif' && num(p.motifTarget)>0) return Math.min(1, num(p.motifCount)/num(p.motifTarget));
  return null;
}
function progressText(p){
  if (p.type==='granny' && num(p.grannyCount)>0) return `${num(p.grannyDone)} из ${num(p.grannyCount)} квадр.`;
  if (p.type==='parts' && (p.parts||[]).length) return `${p.parts.filter(x=>x.done).length} из ${p.parts.length} дет.`;
  if (p.type==='motif') return num(p.motifTarget)>0 ? `${num(p.motifCount)} из ${num(p.motifTarget)} шт.` : `${num(p.motifCount)} шт.`;
  return '';
}
function shoppingNeeds(){
  const out=[];
  for (const y of S.yarns){ const b=yarnBalance(y); if (b.free<0) out.push({y, n:-b.free, for:b.where.filter(w=>w.p.status!=='done').map(w=>w.p.title||catInfo(catOf(w.p)).name)}); }
  return out;
}
function basketState(p){
  const rows = (p.yarns||[]).filter(a=>a.yarnId && yarnById(a.yarnId));
  if (!rows.length) return {cls:'nil', t:'пряжа не выбрана'};
  let need = 0;
  for (const a of rows){ const y = yarnById(a.yarnId); const u = yarnUse(y.id, p.id); const free = num(y.qty) - u.used - u.reserved; const mine = rows.filter(r=>r.yarnId===y.id).reduce((s,r)=>s+num(r.skeins),0); if (free - mine < 0) need = Math.max(need, mine - free); }
  if (need > 0) return {cls:'need', t:`докупить ${fmtN(need)} ${plural(need,'моток','мотка','мотков')}`};
  const tot = projSkeins(p);
  return {cls:'ok', t:`пряжа есть · ${fmtN(tot)} ${plural(tot,'моток','мотка','мотков')}`};
}

// ---- Шкаф
function viewShelf(){
  if (!S.yarns.length) return `<div class="empty">${ballSVG('wool',['#FF5A36']).replace('<svg','<svg style="width:90px;height:90px;overflow:visible"')}<h2>Шкаф пока пуст</h2><p>Сфоткай моток — и он появится на полке. Название и состав можно дописать потом, а можно и не дописывать.</p><button class="btn red" data-quick-yarn>Сфоткать пряжу</button></div>`;
  const all = S.yarns.map(y=>({y, b:yarnBalance(y)})).sort((a,b)=> (a.y.createdAt||0)-(b.y.createdAt||0));
  let h = '';
  for (const g of Object.keys(GROUPS)){
    const list = all.filter(x => yarnGroup(x.y)===g && (x.b.shelf>0 || x.b.reserved>0));
    if (!list.length) continue;
    h += `<div class="shelf"><div class="h3"><i style="background:${GROUP_COL[g]}"></i>${GROUPS[g]}</div>`;
    for (let i=0;i<list.length;i+=4) h += `<div class="srow">${list.slice(i,i+4).map(ballBtn).join('')}</div><div class="board"></div>`;
    h += `</div>`;
  }
  const gone = all.filter(x => x.b.shelf<=0 && x.b.reserved<=0);
  if (gone.length){
    h += `<div class="shelf"><div class="h3"><i style="background:var(--mut)"></i>Закончилась</div>`;
    for (let i=0;i<gone.length;i+=4) h += `<div class="srow">${gone.slice(i,i+4).map(ballBtn).join('')}</div><div class="board" style="opacity:.35"></div>`;
    h += `</div>`;
  }
  return h;
}
function ballBtn({y,b}){
  const resv = b.where.find(w=>w.p.status!=='done');
  const tag = resv ? (() => { const ci = catInfo(catOf(resv.p)); return `<span class="tag" title="Отложено">${icon(ci.icon,'#fff','#111')}</span>`; })() : '';

function doneCounts(){ const counts = {}; S.projects.filter(p=>p.status==='done').forEach(p=>{ const c=catOf(p); counts[c]=(counts[c]||0)+Math.max(1,num(p.copies)||1); }); return counts; }

// ---- Готовое
function viewDone(){
  const done = S.projects.filter(p=>p.status==='done').sort((a,b)=>String(b.endDate||'').localeCompare(String(a.endDate||'')) || (b.updatedAt||0)-(a.updatedAt||0));
  const sceneH = `<div class="scene">${sceneSVG(doneCounts(), S.doneCat)}</div><div class="nb" style="margin:-4px 0 12px">Тапни по вещи — покажу все такие работы. Пунктир — пока не вязала.</div>`;
  if (!done.length) return sceneH + `<div class="empty"><h2>Здесь будут твои работы</h2><p>Добавь готовое изделие одним фото. Схему, пряжу и крючок допишешь, когда захочешь повторить.</p><button class="btn red" data-quick="done">Добавить работу</button></div>`;
  const counts = doneCounts();
  const cats = allCats().filter(c=>counts[c.id]);
  let h = sceneH + `<div class="chips" id="doneChips"><button class="chip txt" data-done-cat="all" aria-pressed="${S.doneCat==='all'}">Все</button>${cats.map(c=>`<button class="chip" data-done-cat="${c.id}" aria-pressed="${S.doneCat===c.id}">${icon(c.icon, S.doneCat===c.id?'var(--bg)':c.color, S.doneCat===c.id?'var(--ink)':'var(--surface)')}${esc(c.name)} · ${counts[c.id]}</button>`).join('')}</div>`;
  const list = S.doneCat==='all' ? done : done.filter(p=>catOf(p)===S.doneCat);
  h += `<div class="tiles">${list.map(doneTile).join('')}</div>`;
  return h;
}
function doneTile(p){
  const t = catTile(catOf(p)); const c = cover(p);
  return `<button class="tl" style="background:${t.bg}" data-view-project="${p.id}">${c?`<img src="${img(c)}" alt="" loading="lazy">`:t.svg}<em>${esc(p.title||catInfo(catOf(p)).name)}${num(p.copies)>1?` ×${num(p.copies)}`:''}</em></button>`;
}

// ---- list interactions
async function quickTimer(id){
  const p = projById(id); if (!p) return;
  const stages = clone(p.stages||[]);
  try{
    if (p.timer){
      const add = Math.max(1, Math.round((Date.now()-p.timer.startedAt)/60000));
      const st = stages.find(s=>s.id===p.timer.stageId); if (st) st.minutes = num(st.minutes) + add;
      await db.collection('projects').doc(id).update({stages, timer:null, updatedAt:Date.now()});
      toast(`+ ${fmtMin(add)} к «${STAGES[st?.kind]||'вязанию'}»`);
    } else {
      let st = stages.find(s=>s.kind==='knit') || stages[0];
      if (!st){ st = {id:uid(), kind:'knit', hook:'', minutes:0}; stages.push(st); }
      await db.collection('projects').doc(id).update({stages, timer:{stageId:st.id, startedAt:Date.now()}, updatedAt:Date.now()});
      toast('Таймер пошёл');
    }
  }catch(e){ toast('Не получилось сохранить'); }
}
document.addEventListener('click', async e => {
  if (e.target.closest('#sheet') || e.target.closest('#lb')) return;
  const q = e.target.closest('[data-qt]'); if (q){ quickTimer(q.dataset.qt); return; }
  const vy = e.target.closest('[data-view-yarn]'); if (vy){ openView('yarn', vy.dataset.viewYarn); return; }
  const vp = e.target.closest('[data-view-project]'); if (vp){ openView('project', vp.dataset.viewProject); return; }
  const dc = e.target.closest('[data-done-cat]'); if (dc){ S.doneCat = dc.dataset.doneCat; render(); return; }
  const sc = e.target.closest('[data-scene]'); if (sc){ const k = sc.dataset.scene; const n = doneCounts()[k]||0; if (!n){ toast(`${catInfo(k).name} — пока не вязала`); return; } S.doneCat = (S.doneCat===k) ? 'all' : k; render(); if (S.doneCat!=='all') document.getElementById('doneChips')?.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  if (e.target.closest('[data-shop-toggle]')){ S.shopOpen = !S.shopOpen; render(); return; }
  if (e.target.closest('[data-quick-yarn]')){ $('#quickYarn').click(); return; }
  const qk = e.target.closest('[data-quick]'); if (qk){ openQuick(qk.dataset.quick); return; }
  const bt = e.target.closest('[data-bought]'); if (bt){ const y=yarnById(bt.dataset.bought); if(!y) return; try{ await db.collection('yarns').doc(y.id).update({qty: num(y.qty)+num(bt.dataset.n), updatedAt:Date.now()}); toast(`+${fmtN(num(bt.dataset.n))} мот. в шкаф`);}catch(err){toast('Не получилось сохранить');} return; }
  const sd = e.target.closest('[data-shop-del]'); if (sd){ try{ await db.collection('shop').doc(sd.dataset.shopDel).delete(); }catch(err){} return; }
});
document.addEventListener('change', async e => {
  const sd = e.target.closest('[data-shop-done]'); if (sd && !e.target.closest('#sheet')){ try{ await db.collection('shop').doc(sd.dataset.shopDone).update({done: sd.checked}); }catch(err){} }
});
document.addEventListener('submit', async e => {
  if (e.target.id==='shopForm'){ e.preventDefault(); const t=$('#shopText').value.trim(); if(!t) return; try{ await db.collection('shop').add({text:t, link:$('#shopLink').value.trim(), qty:$('#shopQty').value.trim(), forId:$('#shopFor').value, done:false, createdAt:Date.now()}); }catch(err){toast('Не получилось добавить');} }
});
$('#fab').addEventListener('click', () => { if (S.tab==='shelf') $('#quickYarn').click(); else openQuick({plans:'plan', now:'wip', done:'done'}[S.tab]); });
$('#menuBtn').addEventListener('click', () => openView('menu', null));

// quick add yarn from photos (one photo = one yarn)
async function addYarnsFromFiles(files, opts={}){
  files = [...files]; if (!files.length) return [];
  toast(files.length > 1 ? `Добавляю ${files.length} мотка…` : 'Добавляю моток…');
  const ids = [];
  for (const f of files){
    try{ const {id, blob} = await uploadPhoto(f); const col = await extractColors(blob);
      const ref = await db.collection('yarns').add({name:'', photo:id, colors:col.colors, color:col.colors[0], multi:col.multi, qty: opts.qty ?? 1, createdAt:Date.now(), updatedAt:Date.now()});
      ids.push(ref.id);
    }catch(err){ toast('Фото не загрузилось'); }
  }
  return ids;
}
$('#quickYarn').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  const ids = await addYarnsFromFiles(files);
  if (ids.length === 1) openView('yarn', ids[0]); else if (ids.length) toast(`На полке ${ids.length} ${plural(ids.length,'новый моток','новых мотка','новых мотков')}`);
});

// ================= sheet stack =================
const BACK_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M15 5l-7 7 7 7"/></svg>';
function head(title, right=''){ return `<div class="sh-head"><div class="in"><button class="sq-btn" data-back aria-label="Назад">${BACK_SVG}</button><h2 id="shTitle">${esc(title)}</h2>${right}</div></div>`; }
function openView(kind, id){ STACK.push({t:'view', kind, id}); drawTop(true); }
function back(){
  const fr = STACK.pop();
  if (fr?.t==='edit') fr.ed.saver.flush();
  if (fr?.t==='quick' && !fr.saved) gcBlobs(fr.q.files.map(f=>f.id));
  ED = null;
  if (!STACK.length){ $('#sheet').innerHTML=''; document.body.style.overflow=''; render(); return; }
  drawTop(true); render();
}
function drawTop(reset){
  const fr = STACK.at(-1); if (!fr) return;
  document.body.style.overflow='hidden';
  const sh = $('#sheet .sheet'); const g = $('#sheet .gal');
  const keep = !reset && sh ? {top: sh.scrollTop, gx: g ? g.scrollLeft : 0} : null;
  let html;
  if (fr.t==='view'){ ED = null; html = fr.kind==='yarn' ? yarnView(fr.id) : fr.kind==='project' ? projectView(fr.id) : menuView(); }
  else if (fr.t==='quick'){ ED = null; html = quickView(fr.q); }
  else { ED = fr.ed; html = fr.ed.kind==='project' ? projectForm() : yarnForm(); }
  $('#sheet').innerHTML = `<div class="sheet">${html}</div>`;
  if (keep){ const n=$('#sheet .sheet'); n.scrollTop = keep.top; const gg=$('#sheet .gal'); if (gg) gg.scrollLeft = keep.gx; }
  tickAll(); bindGal();
}
function redrawIfView(){ const fr = STACK.at(-1); if (fr && fr.t==='view') drawTop(false); }
function bindGal(){
  const g = $('#sheet .gal'); if (!g) return; const dots = [...document.querySelectorAll('#sheet .dots b')]; if (!dots.length) return;
  const upd = () => { const i = Math.round(g.scrollLeft / Math.max(1,g.clientWidth)); dots.forEach((d,k)=>d.classList.toggle('on', k===i)); };
  g.addEventListener('scroll', upd, {passive:true}); upd();
}

      <div class="k"><small>Отложено</small><b>${fmtN(b.reserved)}</b></div>
      <div class="k" style="${b.free<0?'border-color:var(--warn)':''}"><small>${b.free<0?'Не хватает':'Свободно'}</small><b style="${b.free<0?'color:var(--warn)':''}">${fmtN(Math.abs(b.free))}</b></div>
    </div>
    <div class="row-top"><input type="number" inputmode="decimal" id="buyN" placeholder="Сколько мотков докупила"><button class="btn sm" data-buy="${y.id}">+ докупила</button></div>
    ${facts.length || y.link ? `<div class="facts">${facts.map(f=>`<span>${f}</span>`).join('')}${y.link?`<a href="${esc(y.link)}" target="_blank" rel="noopener">товар ↗</a>`:''}</div>` : ''}
    ${used.length ? `<div class="h3" style="margin:6px 0 0">Из неё</div><div class="ptiles">${used.map(p=>{ const t=catTile(catOf(p)); const c=cover(p); return `<button class="tl" style="background:${t.bg}" data-view-project="${p.id}">${c?`<img src="${img(c)}" alt="" loading="lazy">`:t.svg}<em>${esc(STATUS[p.status])}</em></button>`; }).join('')}</div>` : ''}

// ================= project view (recipe) =================
function projectView(id){
  const p = projById(id);
  if (!p) return head('Изделие') + `<div class="sh-body"><div class="empty"><p>Этого изделия больше нет.</p></div></div>`;
  const ci = catInfo(catOf(p)); const fg = LIGHT(ci.color)?'#111':'#fff';
  const slides = [...(p.photos||[]).map(x=>({id:x,l:''})), ...(p.patternImgs||[]).map(x=>({id:x,l:'схема'})), ...(p.refImgs||[]).map(x=>({id:x,l:'референс'}))];
  const gal = slides.length
    ? `<div class="gal-wrap"><div class="gal">${slides.map(s=>`<button class="sl" data-lb="${s.id}" aria-label="Открыть фото"><img src="${img(s.id)}" alt="" loading="lazy">${s.l?`<span class="gal-lab">${s.l}</span>`:''}</button>`).join('')}</div>${slides.length>1?`<div class="dots">${slides.map(()=>'<b></b>').join('')}</div>`:''}</div>`
    : `<div class="gal" style="background:${ci.color}"><div class="sl">${icon(ci.icon,fg,ci.color)}</div></div>`;
  const ys = (p.yarns||[]).filter(a=>yarnById(a.yarnId));
  const hooks = hooksOf(p); const tm = totalMin(p); const cost = projCost(p); const sk = projSkeins(p);
  const gifts = (p.gifts||[]).map(g=>personById(g.personId)?.name).filter(Boolean);
  let actions = '';
  if (p.status==='plan') actions = `<button class="btn red wide" data-status="wip">Начинаю вязать</button>`;
  if (p.status==='wip') actions = `<div class="grid2f"><button class="btn red" data-status="done">Готово!</button><button class="btn line" data-status="frozen">На паузу</button></div>`;
  if (p.status==='frozen') actions = `<button class="btn red wide" data-status="wip">Продолжить</button>`;
  const timer = (p.status==='wip' || p.timer) ? `<button class="big-timer ${p.timer?'on':''}" data-qt="${p.id}"><span>${p.timer?'Идёт время':'Засечь время'}</span>${p.timer?`<span class="tick" data-tick="${p.timer.startedAt}"></span>`:'<span>▶</span>'}</button>` : '';
  // progress
  let prog = '';
  if (p.type==='granny'){
    if (num(p.grannyCount)>0){
      const N = Math.min(400, num(p.grannyCount)), D = num(p.grannyDone); const yc = ys.flatMap(a=>yarnColors(yarnById(a.yarnId))); const pal = yc.length ? yc : ['#FF5A36','#1F4FD8','#FFC93C'];
      prog = `<div class="blk"><div class="blk-h"><b>Квадраты</b><span class="hint">${D} из ${N} · ещё ${Math.max(0,N-D)}</span></div><div class="sqs">${Array.from({length:N},(_,i)=>`<button data-sq="${i}" aria-label="Квадрат ${i+1}" style="${i<D?`background:${pal[i%pal.length]}`:''}"></button>`).join('')}</div><div class="hint">Тапни по квадратику — отметишь, сколько связано.</div></div>`;
    } else prog = `<div class="blk"><div class="blk-h"><b>Квадраты</b></div><div class="row-top"><input type="number" inputmode="numeric" id="gcN" placeholder="Сколько квадратов всего"><button class="btn sm" data-set-gc>OK</button></div></div>`;
  }
  if (p.type==='parts'){
    const parts = p.parts||[];
    prog = `<div class="blk"><div class="blk-h"><b>Детали</b><span class="hint">${parts.filter(x=>x.done).length} из ${parts.length}</span></div>${parts.length?`<div class="parts">${parts.map((x,i)=>`<button class="${x.done?'on':''}" data-part="${i}">${x.done?'✓ ':''}${esc(x.name||'Деталь')}${num(x.minutes)?` <span style="opacity:.6;font-weight:500">${fmtH(x.minutes)}</span>`:''}</button>`).join('')}</div>`:`<div class="hint">Детали добавляются в «Изменить».</div>`}</div>`;
  }
  if (p.type==='motif'){
    const r = motifRate(p);
    prog = `<div class="blk"><div class="blk-h"><b>Связано штук</b>${num(p.motifTarget)?`<span class="hint">цель ${num(p.motifTarget)}</span>`:''}</div><div class="counter"><button data-motif="-1" aria-label="Минус">−</button><b>${num(p.motifCount)}</b><button class="plus" data-motif="1" aria-label="Плюс">+</button></div>${r?`<div class="hint">из одного мотка ≈ <b>${fmtN(r)} шт.</b></div>`:''}</div>`;
  }
  const facts = [];
  if (tm) facts.push(`⏱ ${fmtH(tm)}`);
  if (sk) facts.push(`${fmtN(sk)} ${plural(sk,'моток','мотка','мотков')}`);
  if (cost) facts.push(money(cost));
  if (num(p.copies)>1) facts.push(`связано ${num(p.copies)} шт.`);
  if (p.startDate || p.endDate) facts.push([fmtDate(p.startDate), fmtDate(p.endDate)].filter(Boolean).join(' → '));
  if (p.size) facts.push(esc(p.size));
  if (p.blocking?.done) facts.push('ВТО' + (p.blocking.method?': '+esc(p.blocking.method):''));
  if (gifts.length) facts.push('подарено: ' + esc(gifts.join(', ')));
  const sch = (p.patternImgs||[])[0];
  return head(p.title || ci.name, `<button class="btn line sm" data-edit-project="${p.id}">Изменить</button>`) + `<div class="sh-body flush">
    ${gal}
    <div class="ttl" style="margin-top:6px"><h3>${esc(p.title || ci.name)}</h3><span class="pill p-${p.status}">${STATUS[p.status]}</span></div>
    <div class="facts"><span style="display:flex;gap:6px;align-items:center">${icon(ci.icon, ci.color, 'var(--surface)')}${esc(ci.name)}</span></div>
    ${timer}${actions}${prog}
    <div class="kp">
      <button class="k hook" data-edit-project="${p.id}"><small>Крючок</small><b>${hooks.length?esc(hooks[0]):'—'}${hooks.length?' мм':''}</b>${hooks.length>1?`<span>ещё ${esc(hooks.slice(1).join(', '))} мм</span>`:hooks.length?'':'<span>не указан</span>'}</button>
      <div class="k sch"><small>Схема</small>${sch?`<button class="im" data-lb="${sch}" style="border:0;padding:0"><img src="${img(sch)}" alt=""></button>`:`<div class="im">${icon(ci.icon,'var(--mut)','var(--soft)').replace('<svg','<svg style="width:44px;height:44px"')}</div>`}${p.patternLink?`<a href="${esc(p.patternLink)}" target="_blank" rel="noopener">открыть ↗</a>`:(sch?'':`<button class="lnk" style="border:0;background:none;padding:0;text-align:left" data-edit-project="${p.id}">добавить схему</button>`)}</div>
      <div class="k wide"><small>Пряжа</small>${ys.length?`<div class="yrow" style="margin-top:6px">${ys.map(a=>{ const y=yarnById(a.yarnId); return `<button data-view-yarn="${y.id}" aria-label="${esc(y.name||'Пряжа')}">${yarnBall(y)}${num(a.skeins)?`<em>×${fmtN(num(a.skeins))}</em>`:''}</button>`; }).join('')}</div><div class="hint">${esc(ys.map(a=>yarnById(a.yarnId).name).filter(Boolean).join(', '))}</div>`:`<div class="hint">пряжа не указана — добавь в «Изменить»</div>`}</div>
    </div>
    ${facts.length?`<div class="facts">${facts.map(f=>`<span>${f}</span>`).join('')}</div>`:''}
    ${p.patternInfo?`<div class="blk"><div class="blk-h"><b>По схеме</b></div><div style="white-space:pre-wrap">${esc(p.patternInfo)}</div></div>`:''}
    ${p.patternNotes?`<div class="blk"><div class="blk-h"><b>Что поменяла</b></div><div style="white-space:pre-wrap">${esc(p.patternNotes)}</div></div>`:''}
    ${p.notes?`<div class="blk"><div class="blk-h"><b>Заметки</b></div><div style="white-space:pre-wrap">${esc(p.notes)}</div></div>`:''}
    ${p.status==='done'?`<button class="btn wide" data-again="${p.id}">Связать ещё раз</button>`:''}

function makeSaver(coll){
  const sv = {timer:null, busy:false, again:false, pending:false, ed:null};
  sv.schedule = () => { sv.pending=true; setSave('Сохраняю…'); clearTimeout(sv.timer); sv.timer=setTimeout(sv.flush, 600); };
  sv.flush = async () => {
    clearTimeout(sv.timer); const E = sv.ed; if (!sv.pending || !E) return;
    if (sv.busy){ sv.again=true; return; }
    sv.busy=true; sv.pending=false;
    const data = clone(E.form); delete data.id; data.updatedAt = Date.now(); if (!data.createdAt) data.createdAt = Date.now(); E.form.createdAt = data.createdAt;
    try{ await db.collection(coll).doc(E.id).set(data); E.created=true; if (ED===E) setSave('Сохранено'); }
    catch(err){ sv.pending=true; setSave('Не сохранилось, повторю'); setTimeout(()=>sv.flush(), 2500); }
    sv.busy=false; if (sv.again){ sv.again=false; sv.pending=true; sv.flush(); }
  };
  return sv;
}

// ================= backup =================
let PENDING_RESTORE = null;
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(b); });
const b64ToBlob = (b64, type) => { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type}); };
function lastBackup(){ try{ return Number(localStorage.getItem('klubok-backup')||0); }catch(e){ return 0; } }
async function makeBackup(){
  toast('Готовлю копию…');
  const docs = (await LS.allDocs()).map(d => ({coll:d.coll, id:d.id, data:d.data}));
  const blobs = []; for (const b of await LS.allBlobs()) blobs.push({id:b.id, type:b.blob.type || 'image/jpeg', b64: await blobToB64(b.blob)});
  const json = JSON.stringify({app:'klubok', version:2, exportedAt:new Date().toISOString(), docs, blobs});
  const name = 'klubok-' + today() + '.json'; const file = new File([json], name, {type:'application/json'});
  let shared = false;
  try{ if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Мой клубок — резервная копия'}); shared = true; } }catch(e){ if (e && e.name === 'AbortError') return; }
  if (!shared){ const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
  try{ localStorage.setItem('klubok-backup', String(Date.now())); }catch(e){}
  toast('Копия сохранена'); redrawIfView();
}
async function restoreBackup(file){
  try{
    const data = JSON.parse(await file.text()); if (data.app !== 'klubok' || !Array.isArray(data.docs)) throw new Error('bad');
    await LS.clearAll(); Object.values(URLS).forEach(u => URL.revokeObjectURL(u)); for (const k in URLS) delete URLS[k];
    for (const b of (data.blobs||[])){ const blob = b64ToBlob(b.b64, b.type); await LS.putBlob(b.id, blob); URLS[b.id] = URL.createObjectURL(blob); }
    for (const c in MEM) MEM[c].clear();
    for (const d of data.docs){ if (!MEM[d.coll]) continue; await LS.putDoc(d.coll, d.id, d.data); MEM[d.coll].set(d.id, d.data); }
    for (const c in MEM) emit(c); toast('Всё восстановлено');
  }catch(e){ toast('Это не похоже на копию «Моего клубка»'); }
}

  const params = new URLSearchParams(location.search); if (!params.has('shared')) return;
  history.replaceState(null, '', location.pathname);
  try{ const cache = await caches.open('klubok-share'); const keys = await cache.keys(); const blobs = [];
    for (const k of keys){ const r = await cache.match(k); if (r) blobs.push(await r.blob()); await cache.delete(k); }
    if (blobs.length) openQuick('plan', {askKind:true, blobs});
  }catch(e){}
}
render();
(async () => {
  try{
    try{ await navigator.storage?.persist?.(); }catch(e){}
    for (const b of await LS.allBlobs()) URLS[b.id] = URL.createObjectURL(b.blob);
    for (const d of await LS.allDocs()) if (MEM[d.coll]) MEM[d.coll].set(d.id, d.data);
    for (const c of ['projects','yarns','people','shop','ideas','meta']){
      db.collection(c).onSnapshot(snap => {
        if (c!=='meta') S[c] = snap.docs.map(d => ({id:d.id, ...d.data()}));
        S.loaded = true;
        if (ED && ED.kind==='project') updateHints();
        render(); redrawIfView();
      });
    }
    readShared();
  }catch(e){ S.err = 'Браузер не даёт сохранять данные. Открой приложение в Chrome (не в режиме инкогнито).'; render(); }
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
