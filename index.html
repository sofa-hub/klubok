<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15141A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Клубок">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Мой клубок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Golos+Text:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one phone column, sticky top bar, fixed bottom tab bar, full-screen sheets for editing */
:root{
  --bg:#F2F1F5; --surface:#FFFFFF; --surface2:#E9E7EE; --ink:#1E1C26; --muted:#6C6878;
  --line:#DCD9E3; --accent:#8C3E6E; --accent-ink:#FFFFFF; --accent-soft:#F3E3EC;
  --moss:#4F7340; --moss-soft:#E4EEDD; --sky:#3E6488; --sky-soft:#E0E9F2; --warn:#B4541E; --warn-soft:#F8E6DA;
  --f-display:"Nunito","Trebuchet MS",sans-serif; --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15141A; --surface:#1F1D26; --surface2:#2A2833; --ink:#EEECF3; --muted:#A29EAE;
  --line:#34313E; --accent:#E08BBE; --accent-ink:#22101B; --accent-soft:#3A2232;
  --moss:#9CC487; --moss-soft:#24301F; --sky:#8DB4D9; --sky-soft:#1D2A37; --warn:#F0A372; --warn-soft:#3A2618; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15141A; --surface:#1F1D26; --surface2:#2A2833; --ink:#EEECF3; --muted:#A29EAE;
  --line:#34313E; --accent:#E08BBE; --accent-ink:#22101B; --accent-soft:#3A2232;
  --moss:#9CC487; --moss-soft:#24301F; --sky:#8DB4D9; --sky-soft:#1D2A37; --warn:#F0A372; --warn-soft:#3A2618; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-size:17px;margin:0;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:0;border-radius:999px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.icon-btn{border:0;background:var(--surface2);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;white-space:nowrap;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:10px}
.card{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;gap:12px;align-items:center;border:0;text-align:left;width:100%}
.thumb{width:68px;height:68px;border-radius:12px;background:var(--surface2);flex:none;object-fit:cover;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.card-body{min-width:0;flex:1;display:grid;gap:3px}
.card-title{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px}
.st-wip{background:var(--accent-soft);color:var(--accent)}
.st-plan{background:var(--sky-soft);color:var(--sky)}
.st-done{background:var(--moss-soft);color:var(--moss)}
.st-frozen{background:var(--surface2);color:var(--muted)}
.tick-badge{color:var(--accent);font-weight:600}
.empty{background:var(--surface);border-radius:var(--r);padding:24px 18px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty p{margin:0;max-width:34ch}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:9px 4px 10px;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.badge-n{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:10px;padding:0 5px;margin-left:2px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:24;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(0,0,0,.18);display:grid;place-items:center}
@media(min-width:672px){.fab{right:calc(50% - 304px)}}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.sheet-head .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-st{font-size:12px;color:var(--muted);white-space:nowrap}
.sheet-body{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sec{background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h2{font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=number],input[type=url],input[type=date],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;font-size:16px}
textarea{min-height:76px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.row-top{display:flex;gap:8px;align-items:center}
.row-top>*:first-child{flex:1;min-width:0}
.x{border:0;background:none;color:var(--muted);width:34px;height:34px;border-radius:50%;flex:none;font-size:20px;line-height:1}
.hint{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint.bad{color:var(--warn);font-weight:600}
.hm{display:flex;gap:6px;align-items:center}
.hm input{width:64px}
.timer-on{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-variant-numeric:tabular-nums}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.imgs .im{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2);border:0;padding:0;max-width:100%}
.imgs .im img{width:100%;height:100%;object-fit:cover;display:block}
.add-img{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);padding:6px;cursor:pointer}
.add-img input{display:none}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.tile b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.bar i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.bar .track{background:var(--surface2);border-radius:5px}
.stock{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:68px;height:68px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden}
.swatch img{width:100%;height:100%;object-fit:cover}
.shop-item{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px}
.shop-item .t{flex:1;min-width:0}
.shop-item.done .t{text-decoration:line-through;color:var(--muted)}
.confirm{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px;display:grid;gap:10px}
.lb{position:fixed;inset:0;z-index:60;background:rgba(10,8,14,.92);display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb .bar2{display:flex;justify-content:space-between;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.lb .stage{overflow:auto;display:grid;place-items:center;padding:8px}
.lb img{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain}
.lb .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px)}
a{color:var(--accent)}
.link-out{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;font-size:14px}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:15px;margin:14px 2px 8px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
@media(min-width:520px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile-p{border:0;background:none;padding:0;text-align:left;display:grid;gap:4px;min-width:0;color:inherit}
.tp-img{aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--surface);display:grid;place-items:center;max-width:100%}
.tp-img img{width:100%;height:100%;object-fit:cover;display:block}
.tp-t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-m{font-size:12px;color:var(--muted)}
.card-wrap{position:relative}
.card-wrap .card{padding-right:70px}
.qt{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:1px solid var(--line);background:var(--bg);border-radius:999px;min-width:52px;height:40px;padding:0 12px;font-weight:600;color:var(--accent)}
.qt.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top"><h1 id="ttl">Изделия</h1><div id="topR"></div></header>
  <main id="main"><div class="empty"><p class="muted">Загружаю твои записи…</p></div></main>
</div>
<button class="fab" id="fab" aria-label="Добавить"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="sheet"></div>
<div id="lb"></div>
<div id="toast" hidden class="toast"></div>

<script>
(() => {
// ---------- constants ----------
const STATUS = {wip:'В процессе', plan:'В планах', frozen:'На паузе', done:'Готово'};
const STATUS_ORDER = ['wip','plan','frozen','done'];
const TYPES = {regular:'Обычное', granny:'Бабушкины квадраты', motif:'Мотивы (снежинки и т.п.)'};
const STAGES = {knit:'Вязание', join:'Связывание квадратов', edge:'Обвязка', block:'ВТО', assembly:'Сборка', other:'Другое'};
const BLOCK = ['Влажное','Паром','Стирка','На закрепке (пины)'];
const HOOKS = ['1.5','2','2.5','3','3.5','4','4.5','5','5.5','6','6.5','7','8','9','10','12','15'];
const KINDS = ['Шапка','Шарф','Снуд','Варежки','Носки','Свитер','Кардиган','Плед','Сумка','Игрушка','Снежинка','Салфетка','Подушка','Топ','Панамка','Брелок'];

const GROUPS = {wool:'Шерсть', cotton:'Хлопок', other:'Остальное'};
function autoGroup(y){ const c = String(y?.composition||'').toLowerCase(); if (/шерст|мерин|альпак|мохер|кашемир|ангор|верблюж|wool|merino|alpaca|mohair|cashmere|angora/.test(c)) return 'wool'; if (/хлоп|(^|[^а-яё])л[её]н|льн|бамбук|вискоз|cotton|linen|bamboo|viscose/.test(c)) return 'cotton'; return 'other'; }
const yarnGroup = y => GROUPS[y?.group] ? y.group : autoGroup(y);
const ICON = {
  proj:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>',
  yarn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M6 7c4 1 9 5 11 11M5 12c4 0 8 3 9 8M9 4.5c3 2 7 6 10 7"/></svg>',
  shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a1 1 0 01-1 .8H7.2a1 1 0 01-1-.8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>',
  stats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>',
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  ball:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".55"><circle cx="12" cy="12" r="8"/><path d="M6 7c4 1 9 5 11 11M5 12c4 0 8 3 9 8M9 4.5c3 2 7 6 10 7"/></svg>'
};

// ---------- state ----------
const S = {projects:[], yarns:[], people:[], shop:[], tab:'projects', filter:'all', yfilter:'all', loaded:{}, err:null, slow:false};
let db = null, assets = null, sample = null, sampleImg = false, maxImg = 1;
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtN = n => (Math.round(n*100)/100).toLocaleString('ru-RU');
const money = n => n ? fmtN(n) + ' р.' : '—';
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2)));
const img = id => URLS[id] || '';
const fmtMin = m => { m = Math.round(m||0); if (!m) return '0 мин'; const h = Math.floor(m/60), mm = m%60; return (h? h+' ч ':'') + (mm? mm+' мин':'').trim(); };
const fmtClock = ms => { const s = Math.max(0, Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60; return (h? h+':':'') + String(m).padStart(h?2:1,'0') + ':' + String(ss).padStart(2,'0'); };
const fmtDate = d => d ? new Date(d+'T00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'}) : '';
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }

// ---------- derived ----------
const yarnById = id => S.yarns.find(y => y.id === id);
const personById = id => S.people.find(p => p.id === id);
function yarnUse(yid, excludeProjectId){
  let used=0, reserved=0; const where=[];
  for (const p of S.projects){
    if (p.id === excludeProjectId) continue;
    for (const a of (p.yarns||[])) if (a.yarnId === yid && num(a.skeins)>0){
      if (p.status==='done') used += num(a.skeins); else reserved += num(a.skeins);
      where.push({p, n:num(a.skeins)});
    }
  }
  return {used, reserved, where};
}
function yarnBalance(y){ const u = yarnUse(y.id); const qty=num(y.qty); return {...u, qty, shelf: qty-u.used, free: qty-u.used-u.reserved}; }
const totalMin = p => (p.stages||[]).reduce((s,x)=>s+num(x.minutes),0);
function projCost(p){ let c=0; for (const a of (p.yarns||[])){ const y=yarnById(a.yarnId); if (y) c += num(a.skeins)*num(y.price); } return c + num(p.hardwareCost); }
function projSkeins(p){ return (p.yarns||[]).reduce((s,a)=>s+num(a.skeins),0); }
function cover(p){ return (p.photos||[])[0] || (p.refImgs||[])[0] || (p.patternImgs||[])[0]; }
function motifRate(p){ const sk=projSkeins(p); return (p.type==='motif' && sk>0 && num(p.motifCount)>0) ? num(p.motifCount)/sk : 0; }

// ---------- tabs ----------
const TABS = [['projects','Изделия',ICON.proj],['yarn','Пряжа',ICON.yarn],['shop','Покупки',ICON.shop],['stats','Итоги',ICON.stats]];
function renderTabs(){
  const need = shoppingNeeds().length + S.shop.filter(s=>!s.done).length;
  $('#tabs').innerHTML = TABS.map(([k,l,i]) => `<button data-tab="${k}" ${S.tab===k?'aria-current="page"':''}>${i}<span>${l}${k==='shop'&&need?` <span class="badge-n">${need}</span>`:''}</span></button>`).join('');
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t){ S.tab = t.dataset.tab; window.scrollTo(0,0); render(); }
});

// ---------- main render ----------
function render(){
  renderTabs();
  const ttl = {projects:'Изделия', yarn:'Моя пряжа', shop:'Что купить', stats:'Итоги'}[S.tab];
  $('#ttl').textContent = ttl;
  $('#fab').hidden = !(S.tab==='projects' || S.tab==='yarn') || !db;
  $('#topR').innerHTML = '';
  const m = $('#main');
  if (!db){ m.innerHTML = `<div class="empty"><p>${S.err ? esc(S.err) : 'Открываю твои записи…'}</p></div>`; return; }
  const ready = S.loaded.projects && S.loaded.yarns;
  if (!ready){ m.innerHTML = `<div class="empty"><p class="muted">${S.slow?'Хранилище пока не отвечает. Записи появятся, как только связь восстановится.':'Загружаю твои записи…'}</p></div>`; return; }
  m.innerHTML = ({projects:viewProjects, yarn:viewYarn, shop:viewShop, stats:viewStats})[S.tab]();
  tickAll();
}

function viewProjects(){
  const counts = {}; S.projects.forEach(p=>counts[p.status]=(counts[p.status]||0)+1);
  const chips = [['all','Все',S.projects.length], ...STATUS_ORDER.map(k=>[k,STATUS[k],counts[k]||0])];
  let list = S.projects.slice().sort((a,b)=> (STATUS_ORDER.indexOf(a.status)-STATUS_ORDER.indexOf(b.status)) || ((b.updatedAt||0)-(a.updatedAt||0)));
  if (S.filter!=='all') list = list.filter(p=>p.status===S.filter);
  let h = `<div class="chips" role="group" aria-label="Фильтр">${chips.map(([k,l,n])=>`<button class="chip" data-filter="${k}" aria-pressed="${S.filter===k}">${l}${n?` · ${n}`:''}</button>`).join('')}</div>`;
  if (!S.projects.length) return h + `<div class="empty">${ICON.ball}<h2>Пока ни одного изделия</h2><p class="muted">Добавь то, что уже связала, вяжешь сейчас или только планируешь. Фото, схемы, пряжа и время — всё в одной карточке.</p><button class="btn" data-new="project">Добавить изделие</button></div>`;
  if (!list.length) return h + `<div class="empty"><p class="muted">В этом разделе пусто.</p></div>`;
  const tiles = S.filter==='done' || S.filter==='plan';
  return h + (tiles ? `<div class="tiles">${list.map(projTile).join('')}</div>` : `<div class="list">${list.map(projCard).join('')}</div>`);
}
function projCard(p){
  const c = cover(p);
  const yarnNames = (p.yarns||[]).map(a=>yarnById(a.yarnId)?.name).filter(Boolean);
  const t = totalMin(p);
  const qt = (p.status==='wip' || p.timer) ? `<button class="qt ${p.timer?'on':''}" data-qt="${p.id}" aria-label="${p.timer?'Остановить таймер':'Запустить таймер'}">${p.timer?'Стоп':'▶'}</button>` : '';
  return `<div class="card-wrap"><button class="card" data-open-project="${p.id}">
    <div class="thumb">${c?`<img src="${img(c)}" alt="" loading="lazy">`:ICON.ball}</div>
    <div class="card-body">
      <div class="card-title">${esc(p.title||'Без названия')}</div>
      <div class="meta"><span class="pill st-${p.status}">${STATUS[p.status]}</span>${p.kind?`<span>${esc(p.kind)}</span>`:''}${num(p.copies)>1?`<span>× ${num(p.copies)}</span>`:''}</div>
      <div class="meta">${p.timer?`<span class="tick-badge">таймер · <span data-tick="${p.timer.startedAt}"></span></span>`:''}${t?`<span>${fmtMin(t)}</span>`:''}${projSkeins(p)?`<span>${fmtN(projSkeins(p))} мот.</span>`:''}${yarnNames.length?`<span>${esc(yarnNames.slice(0,2).join(', '))}</span>`:''}</div>
    </div></button>${qt}</div>`;
}
function projTile(p){
  const c = cover(p); const bits = [];
  if (p.kind) bits.push(esc(p.kind));
  if (p.status==='done' && p.endDate) bits.push(fmtDate(p.endDate));
  if (p.status==='plan' && projSkeins(p)) bits.push(fmtN(projSkeins(p)) + ' мот.');
  return `<button class="tile-p" data-open-project="${p.id}"><div class="tp-img">${c?`<img src="${img(c)}" alt="" loading="lazy">`:ICON.ball}</div><div class="tp-t">${esc(p.title||'Без названия')}</div>${bits.length?`<div class="tp-m">${bits.join(' · ')}</div>`:''}</button>`;
}
async function quickTimer(id){
  const p = S.projects.find(x=>x.id===id); if (!p) return;
  const stages = JSON.parse(JSON.stringify(p.stages||[]));
  try{
    if (p.timer){
      const add = Math.max(1, Math.round((Date.now()-p.timer.startedAt)/60000));
      const st = stages.find(s=>s.id===p.timer.stageId); if (st) st.minutes = num(st.minutes) + add;
      await db.collection('projects').doc(id).update({stages, timer:null, updatedAt:Date.now()});
      toast(`+ ${fmtMin(add)} к этапу «${STAGES[st?.kind]||'этап'}»`);
    } else {
      let st = stages.find(s=>s.kind==='knit') || stages[0];
      if (!st){ st = {id:uid(), kind:'knit', hook:'', minutes:0}; stages.push(st); }
      await db.collection('projects').doc(id).update({stages, timer:{stageId:st.id, startedAt:Date.now()}, updatedAt:Date.now()});
      toast(`Таймер запущен: ${STAGES[st.kind]}`);
    }
  }catch(e){ toast('Не получилось сохранить, попробуй ещё раз'); }
}

function viewYarn(){
  if (!S.yarns.length) return `<div class="empty">${ICON.ball}<h2>Склад пока пуст</h2><p class="muted">Занеси пряжу один раз: состав, граммовку, цену и ссылку. Потом в изделиях просто выбираешь её из списка, а мотки сами распределяются.</p><button class="btn" data-new="yarn">Добавить пряжу</button></div>`;
  const all = S.yarns.slice().sort((a,b)=> (a.name||'').localeCompare(b.name||'','ru'));
  const cnt = {}; all.forEach(y=>{ const g = yarnGroup(y); cnt[g] = (cnt[g]||0) + 1; });
  let h = `<div class="chips" role="group" aria-label="Группа пряжи">${[['all','Все',all.length], ...Object.entries(GROUPS).map(([k,l])=>[k,l,cnt[k]||0])].map(([k,l,n])=>`<button class="chip" data-yfilter="${k}" aria-pressed="${S.yfilter===k}">${l}${n?` · ${n}`:''}</button>`).join('')}</div>`;
  const groups = S.yfilter==='all' ? Object.keys(GROUPS) : [S.yfilter];

  if (S.yfilter!=='all' && !cnt[S.yfilter]) h += `<div class="empty"><p class="muted">В этой группе пока пусто.</p></div>`;

function yarnCard(y){{

      <div class="swatch" style="background:${esc(y.color||'var(--surface2)')}">${y.photo?`<img src="${img(y.photo)}" alt="" loading="lazy">`:''}</div>

        <div class="stock"><span class="pill st-done">в шкафу ${fmtN(b.shelf)}</span>${b.reserved?`<span class="pill st-plan">в резерве ${fmtN(b.reserved)}</span>`:''}<span class="pill ${b.free<0?'st-wip':'st-frozen'}">${b.free<0?'не хватает '+fmtN(-b.free):'свободно '+fmtN(b.free)}</span></div>
      </div></button>`;}

function shoppingNeeds(){
  const out=[];
  for (const y of S.yarns){ const b=yarnBalance(y); if (b.free<0) out.push({y, n:-b.free, for:b.where.filter(w=>w.p.status!=='done').map(w=>w.p.title||'Без названия')}); }
  return out;
}
function viewShop(){
  const needs = shoppingNeeds();
  let h = `<div class="sec-title">Не хватает под планы</div>`;
  h += needs.length ? `<div class="list">${needs.map(({y,n,for:f})=>`<div class="shop-item"><div class="t"><b>${esc(y.name)}</b> — докупить ${fmtN(n)} мот.${num(y.price)?` · ≈ ${money(n*num(y.price))}`:''}<div class="hint">для: ${esc(f.join(', '))}</div>${y.link?`<a class="link-out" href="${esc(y.link)}" target="_blank" rel="noopener">${esc(y.link)}</a>`:''}</div><button class="btn sm" data-bought="${y.id}" data-n="${n}">Купила</button></div>`).join('')}</div>`
    : `<div class="empty"><p class="muted">Под все планы пряжи хватает. Если в изделии указать больше мотков, чем лежит в шкафу, разница появится здесь.</p></div>`;
  h += `<div class="sec-title">Мой список</div>
    <form class="sec" id="shopForm"><div class="field"><span>Что купить</span><input type="text" id="shopText" placeholder="Например: пуговицы 15 мм, 6 шт"></div>
    <div class="grid2"><div class="field"><span>Ссылка (необязательно)</span><input type="url" id="shopLink" placeholder="https://"></div><div class="field"><span>Сколько</span><input type="text" id="shopQty" placeholder="2 мотка"></div></div>
    <button class="btn" type="submit">Добавить в список</button></form>`;

    h += `<div class="list" style="margin-top:10px">${items.map(s=>`<div class="shop-item ${s.done?'done':''}"><label class="check"><input type="checkbox" data-shop-done="${s.id}" ${s.done?'checked':''} aria-label="Куплено"></label><div class="t">${esc(s.text)}${s.qty?` <span class="muted">· ${esc(s.qty)}</span>`:''}${s.link?`<a class="link-out" href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.link)}</a>`:''}</div><button class="x" data-shop-del="${s.id}" aria-label="Убрать">×</button></div>`).join('')}</div>`;

function viewStats(){
  const done = S.projects.filter(p=>p.status==='done');
  const allMin = S.projects.reduce((s,p)=>s+totalMin(p),0);
  const spent = done.reduce((s,p)=>s+projCost(p),0);
  const skeins = done.reduce((s,p)=>s+projSkeins(p),0);
  const items = done.reduce((s,p)=>s+Math.max(1,num(p.copies)||1),0);
  const byStage = {}; S.projects.forEach(p=>(p.stages||[]).forEach(st=>byStage[st.kind]=(byStage[st.kind]||0)+num(st.minutes)));
  const maxSt = Math.max(1,...Object.values(byStage));
  let h = `<div class="sum">
    <div class="tile"><span class="small muted">Готово изделий</span><b>${items}</b></div>
    <div class="tile"><span class="small muted">Часов за вязанием</span><b>${Math.round(allMin/60)} ч</b></div>
    <div class="tile"><span class="small muted">Ушло мотков</span><b>${fmtN(skeins)}</b></div>
    <div class="tile"><span class="small muted">Пряжа и фурнитура</span><b>${spent?fmtN(Math.round(spent)):'0'} р.</b></div></div>`;
  const stEntries = Object.entries(byStage).filter(([,v])=>v>0);
  if (stEntries.length){
    h += `<div class="sec-title">Время по этапам</div><div class="sec bars">${stEntries.sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${STAGES[k]||k}</span><span class="track"><i style="width:${Math.max(3,v/maxSt*100)}%"></i></span><span class="small muted">${fmtMin(v)}</span></div>`).join('')}</div>`;
  }
  const motifs = S.projects.filter(p=>motifRate(p)>0);
  if (motifs.length){
    h += `<div class="sec-title">Мотивы из одного мотка</div><div class="sec">${motifs.map(p=>{const y=yarnById((p.yarns||[])[0]?.yarnId);return `<div class="row-top"><span>${esc(p.title||'Без названия')}${y?` <span class="muted small">· ${esc(y.name)}</span>`:''}</span><b>${fmtN(motifRate(p))} шт.${y&&num(y.weight)?` <span class="muted small">(${fmtN(num(y.weight)/motifRate(p))} г/шт)</span>`:''}</b></div>`;}).join('')}</div>`;
  }
  // people
  const gifts = {}; S.projects.forEach(p=>(p.gifts||[]).forEach(g=>{ if(!g.personId) return; (gifts[g.personId] ||= []).push({p, qty:Math.max(1,num(g.qty)||1), date:g.date}); }));
  h += `<div class="sec-title">Кому я дарила</div><div class="sec">`;
  if (!S.people.length) h += `<p class="muted small" style="margin:0">Добавь людей, и в изделии можно будет отметить, кому оно подарено.</p>`;
  h += S.people.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','ru')).map(pr=>{
    const g = gifts[pr.id]||[]; const n = g.reduce((s,x)=>s+x.qty,0);
    return `<div class="row"><div class="row-top"><b>${esc(pr.name)}</b><span class="muted small">${n?n+' шт.':'пока ничего'}</span><button class="x" data-person-del="${pr.id}" aria-label="Удалить">×</button></div>${g.length?`<div class="hint">${g.map(x=>esc(x.p.title||'Без названия')+(x.qty>1?' ×'+x.qty:'')+(x.date?' · '+fmtDate(x.date):'')).join('<br>')}</div>`:''}<div data-confirm-slot="${pr.id}"></div></div>`;
  }).join('');
  h += `<form id="personForm" class="row-top"><input type="text" id="personName" placeholder="Имя, например «Мама»"><button class="btn sm" type="submit">Добавить</button></form></div>`;
  h += backupSection();
  return h;
}

// ---------- editor infrastructure ----------
let ED = null; // {kind:'project'|'yarn', id, form, created, saver}
function makeSaver(coll){
  const sv = {timer:null, busy:false, again:false, pending:false};
  sv.schedule = () => { sv.pending=true; setSave('Сохраняю…'); clearTimeout(sv.timer); sv.timer=setTimeout(sv.flush, 700); };
  sv.flush = async () => {
    clearTimeout(sv.timer); const E = sv.ed; if (!sv.pending || !E) return;
    if (sv.busy){ sv.again=true; return; }
    sv.busy=true; sv.pending=false;
    const data = JSON.parse(JSON.stringify(E.form)); delete data.id; data.updatedAt = Date.now(); if (!data.createdAt) data.createdAt = Date.now(); E.form.createdAt = data.createdAt;
    try{ await db.collection(coll).doc(E.id).set(data); E.created=true; if (ED===E) setSave('Сохранено'); }
    catch(err){ sv.pending=true; setSave(err?.code==='quota_exceeded'?'Место в хранилище закончилось':'Не сохранилось, повторю'); setTimeout(()=>sv.flush(), 3000); }
    sv.busy=false; if (sv.again){ sv.again=false; sv.pending=true; sv.flush(); }
  };
  return sv;
}
function setSave(t){ const el=$('#saveSt'); if (el) el.textContent=t; }
function setPath(obj, path, val){ const ks=path.split('.'); let o=obj; for (let i=0;i<ks.length-1;i++){ const k=ks[i]; if (o[k]==null) o[k] = /^\d+$/.test(ks[i+1])?[]:{}; o=o[k]; } o[ks.at(-1)] = val; }
function getPath(obj, path){ return path.split('.').reduce((o,k)=>o==null?undefined:o[k], obj); }
function closeEditor(){ if (ED?.saver) ED.saver.flush(); const prev = ED?.prev; if (prev){ ED = prev; rerenderEditor(); render(); return; } ED=null; $('#sheet').innerHTML=''; document.body.style.overflow=''; render(); }
function rerenderEditor(){ const sh=$('#sheet .sheet'); const y=sh?sh.scrollTop:0; (ED.kind==='project'?drawProject:drawYarn)(); const n=$('#sheet .sheet'); if(n) n.scrollTop=y; }

$('#sheet').addEventListener('input', e => {
  if (!ED) return; const el = e.target;
  if (el.dataset.f){ let v = el.type==='checkbox' ? el.checked : el.value; setPath(ED.form, el.dataset.f, v); ED.saver.schedule(); if (el.dataset.f==='title') $('#edTitle').textContent = v || (ED.kind==='yarn'?'Новая пряжа':'Новое изделие'); if (el.dataset.hints!=null) updateHints(); if (el.dataset.rr!=null) rerenderEditor(); }
  if (el.dataset.time){ const i=+el.dataset.time; const row=el.closest('[data-stage-row]'); const h=num(row.querySelector('[data-part="h"]').value), m=num(row.querySelector('[data-part="m"]').value); ED.form.stages[i].minutes = Math.round(h*60+m); ED.saver.schedule(); const tot=$('#totTime'); if (tot) tot.textContent=fmtMin(totalMin(ED.form)); }
});
$('#sheet').addEventListener('change', e => { const el=e.target; if (el.dataset.img!=null) handleFiles(el); if (el.dataset.ai==='yarn') runAiYarn(el); });

$('#sheet').addEventListener('click', async e => {
  if (!ED) return;
  const t = e.target.closest('button,[data-lb]'); if (!t) return;
  const F = ED.form;
  if (t.dataset.close!=null) return closeEditor();
  if (t.dataset.set){ setPath(F, t.dataset.set, t.dataset.val); onSetSide(t.dataset.set, t.dataset.val); ED.saver.schedule(); return rerenderEditor(); }
  if (t.dataset.add){ const arr = (F[t.dataset.add] ||= []); arr.push(({yarns:{yarnId:'',skeins:''}, stages:{id:uid(),kind:'knit',hook:'',minutes:0}, gifts:{personId:'',date:'',qty:1}})[t.dataset.add]); ED.saver.schedule(); return rerenderEditor(); }
  if (t.dataset.del){ const [arr,i]=t.dataset.del.split(':'); const it=F[arr][+i]; if (arr==='stages' && F.timer && F.timer.stageId===it.id) F.timer=null; F[arr].splice(+i,1); ED.saver.schedule(); return rerenderEditor(); }
  if (t.dataset.timerStart){ F.timer = {stageId:t.dataset.timerStart, startedAt:Date.now()}; ED.saver.schedule(); ED.saver.flush(); return rerenderEditor(); }
  if (t.dataset.timerStop!=null){ stopTimer(); return; }
  if (t.dataset.gotoYarn){ ED.saver.flush(); const prev = ED; openYarn(t.dataset.gotoYarn); ED.prev = prev; return; }
  if (t.dataset.again!=null){ knitAgain(); return; }
  if (t.dataset.aiPattern!=null){ runAiPattern(); return; }
  if (t.dataset.lb){ openLightbox(t.dataset.lb, t.dataset.arr); return; }

// ---------- images ----------
async function compress(file){
  if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type) && file.type) { if (file.type==='image/gif') return file; }
  try{
    const url = URL.createObjectURL(file); const im = new Image(); im.src = url; await im.decode();
    const max = 1800; let {naturalWidth:w, naturalHeight:h} = im; const k = Math.min(1, max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
    const c = document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h); URL.revokeObjectURL(url);
    const isPng = file.type==='image/png';
    return await new Promise(r=>c.toBlob(b=>r(b||file), isPng && file.size<1.5e6 ? 'image/png' : 'image/jpeg', 0.86));
  }catch(e){ return file; }
}
async function handleFiles(input){
  const key = input.dataset.img; const files = [...input.files]; input.value=''; if (!files.length || !ED) return;
  if (!assets){ toast('Загрузка фото здесь недоступна'); return; }
  const target = ED.kind==='yarn' ? null : (ED.form[key] ||= []);
  setSave(`Загружаю фото (${files.length})…`);
  for (const f of files){
    try{ const blob = await compress(f); const r = await assets.upload(blob, blob.type?undefined:{type:'image/jpeg'});
      if (!ED) return; if (ED.kind==='yarn') ED.form.photo = r.id; else target.push(r.id); ED.saver.schedule(); rerenderEditor(); }
    catch(err){ toast(err?.code==='too_large'?'Фото слишком большое':err?.code==='quota_or_state'?'Место для фото закончилось':'Фото не загрузилось, попробуй ещё раз'); }
  }
}

const AI_ERR = c => ({not_granted:'Приложению не разрешено обращаться к Claude. Разрешение можно включить в меню артефакта.', rate_limited:'Лимит Claude сейчас исчерпан, попробуй позже.', image_rejected:'Эта картинка не подошла, попробуй другую (JPG или PNG).', invalid_json:'Ответ не получилось разобрать, попробуй ещё раз.', refused:'Claude не смог разобрать эту картинку.', session_expired:'Нужно заново войти в Claude.', sampling_disabled:'Claude недоступен для этого аккаунта.', images_unavailable:'Отправка картинок здесь недоступна.'}[c] || 'Не получилось распознать, попробуй ещё раз.');
const YARN_PROMPT = 'На картинках этикетка пряжи или скриншот карточки пряжи с маркетплейса (часто на русском). Извлеки данные об ОДНОМ мотке. Ответь только JSON-объектом вида {"name":"Cotton Gold","brand":"Alize","composition":"55% хлопок, 45% акрил","weight":100,"length":330,"colorName":"№ 62","lot":null,"hookRec":"3-4","price":250,"colorHex":"#d8c3a5"}. name — название линейки без бренда; weight — граммы в одном мотке (число); length — метры в одном мотке (число); price — цена за один моток числом без валюты (если цена за упаковку из N мотков, раздели на N); hookRec — рекомендуемый крючок в мм; lot — номер партии, если виден; colorHex — примерный основной цвет пряжи на фото. Состав пиши по-русски. Если чего-то нет на картинке, ставь null. Ничего не выдумывай.';
const PATTERN_PROMPT = 'На картинках схема или описание вязаного изделия (крючком или спицами), часто скриншот из Pinterest. Ответь только JSON-объектом: {"title":"...","kind":"...","type":"regular","hook":"4","size":"...","gauge":"...","info":"..."}. title — короткое название изделия по-русски; kind — что это, одним-двумя словами (шапка, плед, снежинка, салфетка); type — "granny", если изделие собирается из бабушкиных квадратов или других квадратных мотивов, "motif", если это отдельные мотивы вроде снежинок, иначе "regular"; hook — размер крючка в мм, если указан; size — размер готового изделия, если указан; gauge — плотность, если указана; info — по-русски 1–3 короткие строки: какая пряжа и сколько нужно по схеме, важные особенности. Если чего-то нет, ставь null. Ничего не выдумывай.';

function fillEmpty(F, key, val, label, got){ if (val==null || String(val).trim()==='' || String(val)==='null') return; if (String(F[key]??'').trim()) return; F[key] = typeof val==='string' ? val.trim() : val; got.push(label); }
const posNum = v => { const x = num(v); return x>0 ? x : null; };

    fillEmpty(F,'size',r.size,'размер',got); fillEmpty(F,'gauge',r.gauge,'плотность',got); fillEmpty(F,'patternInfo',r.info,'что нужно по схеме',got);
    my.aiMsg = got.length ? 'Заполнила: ' + got.join(', ') + '. Проверь, всё ли верно.' : 'Новых данных не нашлось: поля уже заполнены или на схеме этого нет.';

// ---------- timers ----------
function tickAll(){ const now=Date.now(); document.querySelectorAll('[data-tick]').forEach(el=>el.textContent=fmtClock(now-num(el.dataset.tick))); }
setInterval(tickAll, 1000);

// ---------- local storage on this device (IndexedDB) ----------
const URLS = {};
const LS = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('klubok', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('docs', {keyPath:'key'}); d.createObjectStore('blobs', {keyPath:'id'}); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const st = t.objectStore(store); let out; const r = fn(st); if (r) r.onsuccess = () => out = r.result; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    allDocs: () => tx('docs','readonly', s => s.getAll()),
    putDoc: (coll, id, data) => tx('docs','readwrite', s => s.put({key:coll+'/'+id, coll, id, data})),
    delDoc: (coll, id) => tx('docs','readwrite', s => s.delete(coll+'/'+id)),
    allBlobs: () => tx('blobs','readonly', s => s.getAll()),
    putBlob: (id, blob) => tx('blobs','readwrite', s => s.put({id, blob})),
    delBlob: id => tx('blobs','readwrite', s => s.delete(id)),
    clearAll: async () => { await tx('docs','readwrite', s => s.clear()); await tx('blobs','readwrite', s => s.clear()); }
  };
})();
const MEM = {projects:new Map(), yarns:new Map(), people:new Map(), shop:new Map()};
const LISTEN = {projects:[], yarns:[], people:[], shop:[]};
const clone = o => JSON.parse(JSON.stringify(o));
function emit(c){ const docs = [...MEM[c]].map(([id, d]) => ({id, exists:true, data:() => d})); const snap = {docs, size:docs.length, empty:!docs.length, metadata:{fromCache:false, hasPendingWrites:false}}; queueMicrotask(() => LISTEN[c].forEach(fn => fn(snap))); }
function docRef(c, id){
  return {
    id,
    async set(d){ const v = clone(d); await LS.putDoc(c, id, v); MEM[c].set(id, v); emit(c); },
    async update(d){ const cur = MEM[c].get(id); if (!cur) throw {code:'invalid_argument'}; const v = {...cur, ...clone(d)}; await LS.putDoc(c, id, v); MEM[c].set(id, v); emit(c); },
    async delete(){ await LS.delDoc(c, id); MEM[c].delete(id); emit(c); }
  };
}
const localDb = {
  collection: c => ({
    doc: id => docRef(c, id || uid()),
    add: async d => { const r = docRef(c, uid()); await r.set(d); return r; },
    onSnapshot: fn => { LISTEN[c].push(fn); emit(c); return () => { LISTEN[c] = LISTEN[c].filter(x => x !== fn); }; }
  })
};
const localAssets = {
  async upload(blob){ const id = uid().replace(/-/g,''); await LS.putBlob(id, blob); URLS[id] = URL.createObjectURL(blob); return {id, url:URLS[id], sizeBytes:blob.size, contentType:blob.type}; },
  async delete(id){ await LS.delBlob(id); if (URLS[id]) URL.revokeObjectURL(URLS[id]); delete URLS[id]; return {deleted:true}; }
};
// remove photos nothing points at any more
async function gcBlobs(ids){
  const used = new Set();
  for (const p of MEM.projects.values()) for (const k of ['photos','patternImgs','refImgs']) (p[k]||[]).forEach(x => used.add(x));
  for (const y of MEM.yarns.values()) if (y.photo) used.add(y.photo);
  if (ED){ const F = ED.form; for (const k of ['photos','patternImgs','refImgs']) (F[k]||[]).forEach(x => used.add(x)); if (F.photo) used.add(F.photo); }
  for (const id of ids) if (id && !used.has(id)) { try{ await localAssets.delete(id); }catch(e){} }
}

// ---------- backup ----------
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(b); });
const b64ToBlob = (b64, type) => { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type}); };
function lastBackup(){ try{ return Number(localStorage.getItem('klubok-backup')||0); }catch(e){ return 0; } }
async function makeBackup(){
  toast('Готовлю копию…');
  const docs = (await LS.allDocs()).map(d => ({coll:d.coll, id:d.id, data:d.data}));
  const blobs = [];
  for (const b of await LS.allBlobs()) blobs.push({id:b.id, type:b.blob.type || 'image/jpeg', b64: await blobToB64(b.blob)});
  const json = JSON.stringify({app:'klubok', version:1, exportedAt:new Date().toISOString(), docs, blobs});
  const name = 'klubok-' + new Date().toISOString().slice(0,10) + '.json';
  const file = new File([json], name, {type:'application/json'});
  let shared = false;
  try{ if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Мой клубок — резервная копия'}); shared = true; } }catch(e){ if (e && e.name === 'AbortError') return; }
  if (!shared){ const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
  try{ localStorage.setItem('klubok-backup', String(Date.now())); }catch(e){}
  toast('Резервная копия сохранена'); render();
}
async function restoreBackup(file){
  try{
    const data = JSON.parse(await file.text());
    if (data.app !== 'klubok' || !Array.isArray(data.docs)) throw new Error('bad');
    await LS.clearAll(); Object.values(URLS).forEach(u => URL.revokeObjectURL(u)); for (const k in URLS) delete URLS[k];
    for (const b of (data.blobs||[])){ const blob = b64ToBlob(b.b64, b.type); await LS.putBlob(b.id, blob); URLS[b.id] = URL.createObjectURL(blob); }
    for (const c in MEM) MEM[c].clear();
    for (const d of data.docs){ if (!MEM[d.coll]) continue; await LS.putDoc(d.coll, d.id, d.data); MEM[d.coll].set(d.id, d.data); }
    for (const c in MEM) emit(c);
    toast('Всё восстановлено из копии');
  }catch(e){ toast('Это не похоже на копию «Моего клубка»'); }
}
function backupSection(){
  const lb = lastBackup(); const days = lb ? Math.floor((Date.now()-lb)/864e5) : null;
  const stale = !lb || days >= 14;
  return `<div class="sec-title">Резервная копия</div><section class="sec">
    <div class="hint ${stale && (S.projects.length || S.yarns.length) ? 'bad' : ''}">${lb ? `Последняя копия: ${days===0?'сегодня':days+' дн. назад'}.` : 'Копию ещё не делала.'} Все записи и фото хранятся только на этом телефоне. Сохраняй копию раз в пару недель в облако или себе в мессенджер.</div>
    <div class="row-top"><button class="btn" data-backup>Сохранить копию</button><label class="btn ghost">Восстановить<input type="file" accept="application/json,.json" data-restore hidden></label></div>
    <div id="restoreSlot"></div></section>`;
}
document.addEventListener('click', e => { if (e.target.closest('[data-backup]')) makeBackup(); if (e.target.closest('[data-restore-no]')) { $('#restoreSlot').innerHTML=''; } const y = e.target.closest('[data-restore-yes]'); if (y && PENDING_RESTORE){ const f = PENDING_RESTORE; PENDING_RESTORE = null; $('#restoreSlot').innerHTML=''; restoreBackup(f); } });
let PENDING_RESTORE = null;
document.addEventListener('change', e => { const el = e.target.closest('[data-restore]'); if (!el || !el.files[0]) return; PENDING_RESTORE = el.files[0]; el.value=''; $('#restoreSlot').innerHTML = `<div class="confirm"><span>Заменить все текущие записи и фото данными из копии «${esc(PENDING_RESTORE.name)}»? Текущие данные пропадут.</span><div class="row-top"><button class="btn danger sm" data-restore-yes>Заменить</button><button class="btn ghost sm" data-restore-no>Отмена</button></div></div>`; });

// ---------- boot ----------
render();
(async () => {
  try{
    try{ await navigator.storage?.persist?.(); }catch(e){}
    for (const b of await LS.allBlobs()) URLS[b.id] = URL.createObjectURL(b.blob);
    for (const d of await LS.allDocs()) if (MEM[d.coll]) MEM[d.coll].set(d.id, d.data);
    db = localDb; assets = localAssets;
    for (const c of ['projects','yarns','people','shop']){
      db.collection(c).onSnapshot(snap => {
        S[c] = snap.docs.map(d => ({id:d.id, ...d.data()}));
        S.loaded[c] = true;
        if (ED && ED.kind==='project') updateHints();
        render();
      });
    }
  }catch(e){ S.err = 'Браузер не даёт сохранять данные. Открой приложение в Safari или Chrome (не в режиме инкогнито).'; render(); }
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
